e.`},{label:`Bildung (Schule, Studium, Lehre, Forschung)`,background:`Akademiker*in`,stats:{int:2},flags:[`student`],reaction:`Bildung! Die Monster sind beeindruckt. Nein, sind sie nicht.`},{label:`IT und Internet`,background:`IT-Mensch`,stats:{int:1,ges:1},flags:[`it`],reaction:`Du hast Computer repariert. Hier gibt es keine Computer. Nur Probleme.`},{label:`Kunst, Musik oder Schauspiel`,background:`Künstler*in`,stats:{cha:2},flags:[`kuenstler`],reaction:`Endlich jemand, der weiß, dass das hier eine Show ist.`},{label:`Natur (Landwirtschaft, Forst, Garten)`,background:`Naturmensch`,stats:{kon:1,str:1},flags:[`natur`],reaction:`Du kennst dich mit Lebewesen aus. Vor allem damit, wie man sie loswird.`},{label:`Verkauf und Handel`,background:`Verkäufer*in`,stats:{cha:2},flags:[`handel`],gold:10,reaction:`Du kannst Dinge verkaufen. Hier unten verkauft man vor allem sein Leben. Teuer, hoffentlich.`},{label:`Nichts davon (arbeitslos, Rente, Haushalt)`,background:`Freigeist`,stats:{cha:1,int:1},flags:[`frei`],reaction:`Viel Zeit gehabt. Die Systemstimme hofft, du hast sie genutzt. Für Kampftraining.`},{label:`Medien, Marketing und Social Media`,background:`Medienmensch`,stats:{cha:2},flags:[`medien`],reaction:`Du weißt, wie man Aufmerksamkeit bekommt. Hier unten ist Aufmerksamkeit eine Währung. Und ein Todesurteil.`},{label:`Transport und Logistik`,background:`Logistiker*in`,stats:{kon:1,ges:1},flags:[`logistik`],reaction:`Du bringst Dinge von A nach B. Ab jetzt vor allem dich selbst. Lebend, wenn möglich.`},{label:`Recht, Finanzen und Versicherungen`,background:`Finanzmensch`,stats:{int:1,cha:1},flags:[`finanzen`],gold:15,reaction:`Verträge, Paragrafen, Zinsen. Die Systemstimme hat auch Verträge. Kleingedruckt.`},{label:`Soziales und Erziehung`,background:`Sozialarbeiter*in`,stats:{cha:1,kon:1},flags:[`sozial`],reaction:`Du hast dich um andere gekümmert. Hier kümmern sich alle nur um dich. Mit Zähnen.`},{label:`Technik, Ingenieurwesen und Labor`,background:`Techniker*in`,stats:{int:2},flags:[`technik`],reaction:`Du verstehst, wie Dinge funktionieren. Und wie man sie explodieren lässt, hofft die Systemstimme.`},{label:`Dienstleistung (Friseur, Kosmetik, Reinigung, Hotel)`,background:`Dienstleister*in`,stats:{ges:1,cha:1},flags:[`dienstleistung`],reaction:`Kundenkontakt. Freundlich bleiben, auch wenn das Gegenüber dich beißen will. Perfekte Vorbereitung.`},{label:`Schule, Ausbildung oder Studium (noch nicht fertig)`,background:`Azubi/Student*in`,stats:{int:1,ges:1},flags:[`student`],reaction:`Mitten in der Ausbildung. Glückwunsch, du hast gerade die Abschlussprüfung erreicht. Sie dauert bis zum Tod.`}]},{id:`handwerk`,question:`Welches Handwerk genau?`,when:t=>e(t,`beruf`,0),answers:[{label:`Schreiner*in`,background:`Schreiner*in`,stats:{str:1},skills:[`improvisation`],reaction:`Holz ist geduldig. Monster nicht. Aber ein Stuhlbein ist ein Stuhlbein.`},{label:`Klempner*in`,background:`Klempner*in`,hand:`rohrzange`,traits:[`klempner`],reaction:`Abflüsse. Rohre. Dinge, die aus Abflüssen kommen. Du bist hier genau richtig.`},{label:`Elektriker*in`,background:`Elektriker*in`,stats:{int:1,ges:1},reaction:`Strom gibt es keinen mehr. Du hast trotzdem ein Gefühl für Spannung.`},{label:`Dachdecker*in`,background:`Dachdecker*in`,traits:[`dachdecker`],stats:{ges:1},reaction:`Schwindelfrei. Sprünge sind dein Ding. Landungen hoffentlich auch.`},{label:`Schädlingsbekämpfer*in`,background:`Schädlingsbekämpfer*in`,traits:[`schaedlingsbekaempfer`],reaction:`Ratten, Kakerlaken, Spinnen. Du kennst sie alle. Sie kennen dich jetzt auch.`}]},{id:`gesundheit`,question:`Was genau hast du im Gesundheitswesen gemacht?`,when:t=>e(t,`beruf`,2),answers:[{label:`Pflege`,background:`Pfleger*in`,skills:[`erste_hilfe`],stats:{kon:1},reaction:`Nachtschichten, Stress, Rückenschmerzen. Der Dungeon ist fast Urlaub.`},{label:`Ärztin oder Arzt`,background:`Ärztin/Arzt`,skills:[`erste_hilfe`],stats:{int:2},reaction:`Du weißt genau, wo es wehtut. Das ist im Kampf erstaunlich nützlich.`},{label:`Tiermedizin`,background:`Tierärztin/Tierarzt`,traits:[`tierarzt`],reaction:`Tiere versorgen. Und Tiere besiegen. Beides ist jetzt dein Job.`},{label:`Rettungsdienst`,background:`Rettungssanitäter*in`,skills:[`erste_hilfe`],stats:{ges:1,kon:1},reaction:`Schnell rein, schnell raus, niemand stirbt. Gute Einstellung für hier.`}]},{id:`sicherheit`,question:`Welche Uniform hast du getragen?`,when:t=>e(t,`beruf`,3),answers:[{label:`Polizei`,background:`Polizist*in`,stats:{cha:1},flags:[`polizei`],reaction:`Du darfst hier niemanden verhaften. Aber verprügeln geht.`},{label:`Militär`,background:`Soldat*in`,stats:{kon:1,str:1},reaction:`Befehle befolgen. Die Systemstimme hat viele Befehle. Keiner davon hilft dir.`},{label:`Türsteher*in`,background:`Türsteher*in`,traits:[`tuersteher`],stats:{str:1},reaction:`Du kommst hier nicht rein. Oh, warte. Du bist schon drin.`},{label:`Feuerwehr`,background:`Feuerwehrmann/-frau`,traits:[`feuerwehr`],stats:{kon:1},reaction:`Explosionen, Rauch, Chaos. Du fühlst dich hier fast wie zu Hause.`},{label:`Kammerjäger*in mit Giftschein`,background:`Kammerjäger*in`,traits:[`kammerjaeger_gift`],reaction:`Du hast jahrelang Gift eingeatmet. Dein Körper hat aufgegeben, darauf zu reagieren.`}]},{id:`gastro`,question:`Wo in der Gastronomie?`,when:t=>e(t,`beruf`,4),answers:[{label:`In der Küche`,background:`Koch/Köchin`,skills:[`kochen`],hand:`kochmesser`,flags:[`koch`],reaction:`Du hattest gerade ein Messer in der Hand, als der Himmel aufriss. Glück gehabt.`},{label:`Im Service`,background:`Kellner*in`,stats:{ges:2},reaction:`Du kannst zehn Teller tragen und dabei lächeln. Ausweichen liegt dir.`},{label:`Hinter der Bar`,background:`Barkeeper*in`,traits:[`barkeeper`],hand:`flasche`,reaction:`Flaschen fangen, Flaschen werfen. Das Werfen wird wichtiger.`}]},{id:`sport`,question:`Welcher Sport?`,when:t=>e(t,`beruf`,5),answers:[{label:`Fußball`,background:`Fußballprofi`,traits:[`fussballer`],reaction:`Du hast Millionen mit deinen Füßen verdient. Jetzt tötest du damit. Karriereentwicklung.`},{label:`Boxen`,background:`Profiboxer*in`,skills:[`faustkampf`],stats:{str:1},flags:[`schlaeger`],reaction:`Ein echter Boxer. Die Ratten werden das bereuen.`},{label:`Turnen`,background:`Turner*in`,stats:{ges:2},traits:[`dachdecker`],reaction:`Flickflack in den Dungeon. Die Punktrichter sind leider tot.`},{label:`Rugby`,background:`Rugbyspieler*in`,traits:[`rugby`],stats:{kon:1},reaction:`Kopf runter, durch. Eine Philosophie, die hier gut funktioniert.`},{label:`Marathon`,background:`Marathonläufer*in`,stats:{kon:2},flags:[`laeufer`],reaction:`Du kannst stundenlang laufen. Hier wirst du es müssen.`}]},{id:`it`,question:`Was hast du mit Computern gemacht?`,when:t=>e(t,`beruf`,7),answers:[{label:`Programmiert`,background:`Entwickler*in`,stats:{int:2},reaction:`Du findest Fehler in Systemen. Die Systemstimme hofft, du findest keine in ihr.`},{label:`Gestreamt und gezockt`,background:`Streamer*in`,traits:[`streamer`],skills:[`spielerfahrung`],flags:[`gamer`],reaction:`Du kennst Kameras und Chats. Die Galaxis ist nur ein größerer Chat.`},{label:`Netzwerke betreut`,background:`Admin`,stats:{int:1,kon:1},reaction:`Hast du es schon mit Aus- und wieder Einschalten versucht? Bei Monstern klappt es nicht.`},{label:`Social Media und Online-Marketing`,background:`Social Media Manager*in`,traits:[`social_media`],hand:`handy`,reaction:`Reichweite, Engagement, Algorithmus. Der Algorithmus hier heißt Systemstimme. Er ist gnadenlos.`},{label:`Webdesign und UX`,background:`Webdesigner*in`,stats:{ges:1,cha:1},reaction:`Du machst Dinge benutzerfreundlich. Die Benutzeroberfläche dieses Dungeons ist eine Katastrophe. Viel Glück.`},{label:`IT-Support`,background:`IT-Support`,stats:{kon:1},traits:[`paedagoge`],reaction:`Du hast tausendmal erklärt, wo der Knopf ist. Der Knopf heißt jetzt Faust.`},{label:`IT-Sicherheit`,background:`Sicherheitsexpert*in`,traits:[`hacker`],stats:{int:1},reaction:`Du suchst Schwachstellen. Die Monster haben w u alt, aber auch nie zu jung.`},{label:`41 bis 60`,traits:[`lebenserfahrung`],reaction:`Lebenserfahrung. Die Knie knacken, aber der Kopf ist klar.`},{label:`Über 60`,traits:[`lebenserfahrung`,`alte_knochen`],stats:{int:1,cha:1},reaction:`Du hast die Welt schon einmal untergehen sehen. Zumindest gefühlt. Jetzt eben richtig.`}]},{id:`fitness`,question:`Wie fit warst du, ehrlich gesagt?`,answers:[{label:`Sehr fit. Fitnessstudio, fünfmal die Woche.`,stats:{str:2,kon:1},flags:[`fit`],reaction:`Der Bizeps ist notiert. Leider kann man mit Bizeps keine Fallen entschärfen.`},{label:`Normal. Treppen gehen geht.`,stats:{kon:1,ges:1},reaction:`Durchschnitt. Die Systemstimme liebt Durchschnitt. Durchschnitt stirbt so unterhaltsam.`},{label:`Ich war eher der gemütliche Typ.`,stats:{kon:2,str:-1,cha:1},flags:[`gemuetlich`],reaction:`Du hast Reserven. Das ist gut. Monster mögen Reserven auch.`},{label:`Ich bin zu allem gerannt. Marathon, Triathlon …`,stats:{ges:2,kon:2,str:-1},flags:[`laeufer`],reaction:`Ausdauer und Beine. Wegrennen ist eine völlig legitime Kampftechnik.`}]},{id:`hobbysport`,question:`Hast du in deiner Freizeit Sport gemacht?`,answers:[{label:`Nein`,reaction:`Ehrlich. Die Systemstimme schätzt Ehrlichkeit. Sie bestraft sie trotzdem.`},{label:`Kampfsport`,flags:[`kampfsport`],reaction:`Oh, interessant. Welcher denn?`},{label:`Tanzen`,stats:{ges:2},skills:[`ausweichen`],reaction:`Tanzen ist Ausweichen mit Musik. Hier ohne Musik.`},{label:`Klettern`,traits:[`dachdecker`],stats:{str:1},reaction:`Schwindelfrei und griffstark. Die Wände hier sind leider glatt.`},{label:`Mannschaftssport`,traits:[`teamplayer`],reaction:`Du spielst gerne im Team. Hoffentlich hast du ein Haustier.`}]},{id:`kampfsport`,question:`Welcher Kampfsport?`,when:t=>e(t,`hobbysport`,1),answers:[{label:`Karate`,skills:[`treten`],stats:{ges:1},reaction:`Gelber Gürtel? Die Systemstimme sieht es in deinen Augen. Gelber Gürtel.`},{label:`Kickboxen`,skills:[`treten`,`faustkampf`],reaction:`Hände und Füße. Die Grundausstattung für diesen Dungeon.`},{label:`Judo`,skills:[`sturmangriff`],stats:{str:1},reaction:`Umwerfen ist deine Stärke. Draufstampfen lernst du hier.`},{label:`Boxen`,skills:[`faustkampf`],stats:{str:1},reaction:`Ein Boxer im Hobby. Die Faust ist schon warm.`},{label:`Muay Thai`,skills:[`knie`,`ellbogen`],reaction:`Knie und Ellbogen. Die unterschätzten Waffen. Nicht mehr lange.`}]},{id:`augen`,question:`Wie gut siehst du?`,answers:[{label:`Sehr gut`,traits:[`adleraugen`],reaction:`Adleraugen. Du siehst die Monster früh. Das hilft beim Wegrennen.`},{label:`Normal`,reaction:`Normal. Du wirst die Monster rechtzeitig sehen. Knapp.`},{label:`Ich trage eine Brille – und hatte sie auf`,items:[`brille`],reaction:`Die Brille hat den Weltuntergang überlebt. Pass auf sie auf.`},{label:`Ich brauche eine Brille – hatte sie aber nicht auf`,traits:[`kurzsichtig`],reaction:`Oh. Oh nein. Das wird… unscharf.`}]},{id:`schlaf`,question:`Wie schläfst du normalerweise?`,answers:[{label:`Früh ins Bett, früh raus`,traits:[`fruehaufsteher`],reaction:`Frühaufsteher. Der Dungeon hat keinen Morgen, aber du wirst trotzdem wach sein.`},{label:`Ich bin eine Nachteule`,traits:[`nachteule`],reaction:`Du siehst im Dunkeln besser als andere. Hier ist es immer dunkel. Glückwunsch.`},{label:`Ich schlafe kaum`,traits:[`schlaflos`],reaction:`Wer nicht schläft, lernt mehr. Und stirbt müder.`},{label:`Ganz normal`,reaction:`Normal ist gut. Normal ist langweilig. Die Zuschauer mögen es nicht, aber du lebst länger.`}]},{id:`haustier`,question:`Hattest du ein Haustier, als es passierte?`,answers:[{label:`Ja, eine Katze. Sie ist bei mir.`,pet:{species:`Katze`,defaultName:`Mausi`},reaction:`Eine Katze. Natürlich. Sie wird dich überleben. Katzen überleben immer.`},{label:`Ja, einen Hund. Er ist bei mir.`,pet:{species:`Hund`,defaultName:`Bello`},reaction:`Ein Hund! Treu, mutig, und er hält dich vermutlich für den Anführer. Armer Hund.`},{label:`Ja, aber es hat es nicht geschafft.`,stats:{cha:-1,kon:1} ie Zuschauer werden dich lieben.`},{label:`Ein T-Shirt`,items:[`tshirt`],reaction:`Ein T-Shirt. Mit Bandlogo. Die Band ist jetzt auch weg.`},{label:`Ein Hemd`,items:[`hemd`],reaction:`Gebügelt. Wie schön. Das hält bis zur ersten Ratte.`},{label:`Eine Bluse`,items:[`bluse`],reaction:`Seide? Im Keller? Mutig.`},{label:`Einen Pullover oder Hoodie`,items:[`pullover`],reaction:`Warm und weich. Überraschend bissfest.`},{label:`Ein Kleid`,items:[`kleid`],flags:[`kleid`],reaction:`Ein Kleid! Viel Beinfreiheit für Tritte. Die Systemstimme ist begeistert.`},{label:`Eine dicke Winterjacke`,items:[`winterjacke`],reaction:`Daunen. Die Monster beißen erst mal in Federn.`},{label:`Ein Sakko oder einen Anzug`,items:[`anzug`],reaction:`Schick! Du wirst die bestgekleidete Leiche auf dieser Etage.`},{label:`Arbeitskleidung`,items:[`arbeitsjacke`],reaction:`Praktisch. Langweilig. Praktisch langweilig.`},{label:`Eine Uniform oder Dienstjacke`,items:[`uniformjacke`],reaction:`Mit Abzeichen. Hier gibt niemand mehr etwas auf Abzeichen. Außer der Systemstimme.`},{label:`Einen Kasack (Pflege, Praxis)`,items:[`kasack`],reaction:`Berufskleidung. Du warst mitten in der Schicht. Die Schicht ist jetzt länger.`},{label:`Eine Kochjacke`,items:[`kochjacke`],reaction:`Doppelreihig und feuerfest. Die Küche war heiß. Der Keller wird heißer.`},{label:`Ein Sportshirt`,items:[`sportshirt`],reaction:`Atmungsaktiv. Du wirst viel atmen müssen. Schnell.`},{label:`Ein Schlafanzug-Oberteil`,items:[`schlafanzug`],reaction:`Mit Dinos! Die Systemstimme bewertet: 10 von 10.`},{label:`Nichts`,flags:[`oben_ohne`],reaction:`Oben ohne. Die Zuschauer pfeifen. Die Monster sehen nur mehr Angriffsfläche.`}]},{id:`hose`,question:`Und untenrum?`,when:t=>!e(t,`kleidung`,0,5),answers:[{label:`Jeans`,items:[`jeans`],reaction:`Denim. Die unterschätzte Rüstung des 21. Jahrhunderts.`},{label:`Jogginghose`,items:[`jogginghose`],reaction:`Bequem. Die Kontrolle über dein Leben hast du eh verloren.`},{label:`Anzughose`,items:[`anzughose`],reaction:`Mit Bügelfalte. Noch.`},{label:`Einen Rock`,items:[`rock`],reaction:`Beinfreiheit! Kniestöße werden fantastisch.`},{label:`Kurze Hose`,items:[`shorts`],reaction:`Die Knie sind frei. Die Kellerböden sind rau. Das wird schrammig.`},{label:`Arbeitshose`,items:[`arbeitshose`],reaction:`Mit Kniepolstern! Die Systemstimme sieht Kniestöße in deiner Zukunft.`},{label:`Leggings`,items:[`leggings`],reaction:`Dehnbar. Sehr dehnbar. Sprünge werden leichter.`},{label:`Schlafanzughose`,items:[`schlafanzughose`],reaction:`Flanell im Weltuntergang. Stilecht.`},{label:`Nur Unterwäsche`,flags:[`ohne_hose`],reaction:`Nur Unterwäsche. Die Kameras zoomen. Die Systemstimme schaut dezent weg. Nein, tut sie nicht.`}]},{id:`unterwaesche`,question:`Welche Unterwäsche? (Die Systemstimme fragt aus rein statistischen Gründen.)`,answers:[{label:`Boxershorts`,items:[`boxershorts`],reaction:`Mit Herzchen. Die Systemstimme hat nachgesehen.`},{label:`Feinripp`,items:[`feinripp`],reaction:`Deutsches Kulturgut. Die Galaxis ist verwirrt.`},{label:`Sport-BH und Slip`,items:[`sport_bh`],reaction:`Praktisch und stützend. Die klügste Wahl des Tages.`},{label:`Etwas Knappes`,items:[`tanga`],reaction:`Die Zuschauer: *pfeifen*. Die Systemstimme: *notiert*.`},{label:`Lange Unterhose`,items:[`liebestoeter`],reaction:`Warm. Unsexy. Überlebenstauglich.`},{label:`Keine`,flags:[`ohne_unterwaesche`],reaction:`Keine. Die Systemstimme hätte nicht fragen sollen.`}]},{id:`schuhe`,question:`Was hattest du an den Füßen?`,answers:[{label:`Sneaker`,items:[`sneaker`],reaction:`Leicht und schnell. Gut zum Wegrennen.`},{label:`Turnschuhe zum Laufen`,items:[`turnschuhe`],reaction:`Sportschuhe mit Leuchtsohle. Die Monster sehen dich kommen. Und gehen.`},{label:`Lederschuhe`,items:[`lederschuhe`],reaction:`Poliert. Rutschig. Aber ein Tritt damit hinterlässt Eindruck.`},{label:`Arbeitsstiefel mit Stahlkappe`,items:[`arbeitsstiefel`],reaction:`Stahlkappen! Die Systemstimme sieht viele gebrochene Kobold-Nasen.`},{label:`High Heels`,items:[`stoeckelschuhe`],reaction:`Der Absatz ist eine Waffe. Das Gleichgewicht nicht.`},{label:`Gummistiefel`,items:[`gummistiefel`],reaction:`Wasserdicht. Hier unten ist vieles nass. Du willst nicht wissen, womit.`},{label:`Hausschuhe`,items:[`hausschuhe`],reaction:`Plüsch mit Hasenohren. Leise. Sehr leise.`},{label:`Flip-Flops`,items:[`flipflops`],reaction:`Die schlechtestmögliche Wahl. Die Zuschauer lieben es.`},{label:`Crocs`,items:[`crocs`],reaction:`Die Galaxis hat entschieden: nein.`},{label:`Socken in Sandalen`,items:[`socken_sandalen`],reaction:`Deutsches Kulturgut, Teil 2. Die Außerirdischen machen Screenshots.`},{label:`Nichts, ich war barfuß`,flags:[`barfuss`],reaction:`Barfuß im Keller. Glasscherben, Nägel, Schleim. Viel Spaß.`}]},{id:`extra`,question:`Hattest du noch etwas an oder bei dir?`,answers:[{label:`Eine Armbanduhr`,items:[`armbanduhr`],reaction:`Sie zeigt die Zeit einer Welt, die es nicht mehr gibt. Und die Zeit bis zum Einsturz? Leider nicht.`},{label:`Eine Smartwatch`,items:[`smartwatch`],reaction:`Puls: hoch. Schritte: bald sehr viele.`},{label:`Meinen Ehering`,items:[`eigener_ehering`],reaction:`Du drehst ihn schon jetzt. Die Systemstimme sagt nichts dazu. Ausnahmsweise.`},{label:`Eine Brille`,items:[`brille`],reaction:`Die Brille hat den Weltuntergang überlebt. Pass auf sie auf.`},{label:`Eine Basecap`,items:[`cap`],reaction:`Schirm nach vorne, Blick nach vorne.`},{label:`Kopfhörer um den Hals`,items:[`kopfhoerer`],reaction:`Stille. Endlich. Oder: die Stille vor dem Sturm.`},{label:`Eine Laptoptasche`,items:[`laptoptasche`],reaction:`Der Laptop ist tot. Die Tasche lebt.`},{label:`Eine schwere Handtasche`,items:[`handtasche`],reaction:`Was ist da drin? Egal. Sie ist ab jetzt deine Waffe.`},{label:`Nichts weiter`,reaction:`Minimalistisch. Die Systemstimme respektiert das. Sie belohnt es nicht.`}]},{id:`konflikt`,question:`Wie hast du früher Konflikte gelöst?`,answers:[{label:`Reden. Immer erst reden.`,stats:{cha:2},flags:[`diplomat`],reaction:`Reden funktioniert hier unten selten. Aber die Zuschauer mögen Monologe vor dem Tod.`},{label:`Mit den Fäusten.`,stats:{str:2},flags:[`schlaeger`],reaction:`Ehrlich. Direkt. Die Systemstimme sieht Potenzial.`},{label:`Weglaufen.`,stats:{ges:2},flags:[`feigling`],reaction:`Wer wegläuft, lebt länger. Das ist keine Feigheit, das ist Statistik.`},{label:`Planen, Fallen stellen, abwarten.`,stats:{int:2},flags:[`planer`],reaction:`Ein Planer. Die gefährlichste Sorte Crawler. Die Systemstimme wird dich im Auge behalten.`},{label:`Mit dem Kopf durch die Wand.`,traits:[`dickkopf`],reaction:`Wörtlich? Wird sich zeigen. Hier gibt es viele Wände.`}]},{id:`charakter`,question:`Wie würdest du dich selbst beschreiben?`,answers:[{label:`Mutig`,traits:[`mutig`],reaction:`Mutig. Oder einfach schlecht darin, Gefahren einzuschätzen.`},{label:`Vorsichtig`,traits:[`vorsichtig`],reaction:`Vorsicht ist die Mutter der Porzellankiste. Porzellan gibt es hier genug. Zum Werfen.`},{label:`Chaotisch`,traits:[`chaotisch`],reaction:`Chaos ist unterhaltsam. Die Einschaltquoten danken.`},{label:`Berechnend`,traits:[`berechnend`],reaction:`Du rechnest. Die Systemstimme rechnet auch. Mit deinem Tod.`}]},{id:`sozial`,question:`Wie bist du unter Menschen?`,answers:[{label:`Ich bin am liebsten allein`,traits:[`einzelgaenger`],reaction:`Hier unten bist du allein. Wunsch erfüllt.`},{label:`Ich bin gern im Team`,traits:[`teamplayer`],reaction:`Teamwork! Such dir Freunde. Die meisten hier wollen dich allerdings essen.`},{label:`Ich stehe gern im Mittelpunkt`,traits:[`rampensau`],stats:{cha:1},reaction:`Eine Rampensau! Die Kameras lieben dich schon.`},{label:`Ich bin eher schüchtern`,traits:[`schuechtern`],reaction:`Schüchtern. Das heißt, du kannst dich gut anschleichen.`}]},{id:`angst`,question:`Wovor hast du am meisten Angst?`,answers:[{label:`Spinnen und Krabbeltiere`,traits:[`angst_krabbeltiere`],reaction:`Oh. Die Systemstimme hat da eine Nachricht für dich. Nein, lieber nicht. Du wirst es sehen.`},{label:`Ratten`,traits:[`angst_ratten`],reaction:`Ratten. Im Keller. Das wird eine sehr lange erste Etage.`},{label:`Dunkelheit`,traits:[`angst_dunkel`],reaction:`Angst im Dunkeln. In einem Dungeon. Die Systemstimme liebt Ironie.`},{label:`Höhe`,traits:[`hoehenangst`],reaction:`Höhenangst. Gut, dass es nur nach unten geht.`},{label:`Enge Räume`,traits:[`platzangst`],reaction:`Platzangst in einem Labyrinth aus Gängen. Das ist fast schon Absicht.`},{label:`Vor nichts`,traits:[`mutig`],reaction:`Vor nichts? Das wird sich ändern.`}]},{id:`laster`,question:`Worauf konntest du im Alltag nur schwer verzichten?`,answers:[{label:`Auf Zigaretten`,traits:[`raucher`],reaction:`Rauchen gefährdet deine Gesundheit. Hier ist das dein kleinstes Problem.`},{label:`Auf das Feierabendbier`,traits:[`trinker`],reaction:`Prost! Es gibt hier Bier. Warm, aber es gibt es.`},{label:`Auf Süßes`,traits:[`naschkatze`],reaction:`Schokoriegel sind hier Heilmittel. Endlich eine Ausrede.`},{label:`Auf Kaffee`,traits:[`koffein`],reaction:`Ohne Kaffee geht nichts. Die Restaurants hier haben welchen. Zum Glück.`},{label:`Aufs Zocken und Wetten`,traits:[`zocker`],reaction:`Lootboxen! Du wirst es lieben. Und hassen. Vor allem lieben.`},{label:`Auf mein Handy`,traits:[`handysuechtig`],reaction:`Kein Netz. Nie wieder. Du greifst trotzdem alle paar Minuten in die Tasche.`},{label:`Auf nichts, ich brauche nichts`,reaction:`Auf nichts? Die Systemstimme glaubt dir kein Wort.`}]},{id:`glueck`,question:`Hast du im Leben eher Glück oder Pech gehabt?`,answers:[{label:`Ich bin ein Glückspilz`,traits:[`glueckspilz`],reaction:`Du hast den Weltuntergang überlebt. Das zählt als Glück. Knapp.`},{label:`Ich bin ein Pechvogel`,traits:[`pechvogel`],reaction:`Pechvogel. Dein Planet wurde zerstört. Ja, das passt.`},{label:`Mal so, mal so`,reaction:`Durchschnittliches Glück. Die Würfel entscheiden hier unten ohnehin alles.`}]}];function n(e){return t.filter(t=>!t.when||t.when(e))}var r=[`beruf`,`fitness`,`hausti loors:[2],hp:12,hpPerLevel:3,dmg:[2,4],dmgPerLevel:1,treffer:75,ruestung:1,ausweichen:15,size:`winzig`,behavior:`melee`,xp:18,weight:7,pack:[2,4],flavor:`Eine Ratte ohne Fleisch. Ist ihr egal. Beißt trotzdem.`,tags:[`ratte`,`untot`]},{id:`wechselbalg`,name:`Wechselbalg`,glyph:`w`,color:`#c0a0e0`,levels:[4,7],floors:[2],hp:20,hpPerLevel:5,dmg:[3,6],dmgPerLevel:1,treffer:75,ruestung:1,ausweichen:20,size:`klein`,behavior:`melee`,xp:32,weight:3,flavor:`Sieht aus wie ein Kind. Ist keins. Lacht falsch.`,tags:[`folklore`],abilities:[`diebisch`]},{id:`kobold_bombe`,name:`Kobold-Sprengmeister`,glyph:`g`,color:`#ff7040`,levels:[4,7],floors:[2],hp:14,hpPerLevel:4,dmg:[3,5],dmgPerLevel:1,treffer:65,ruestung:1,ausweichen:10,size:`klein`,behavior:`ranged`,range:4,xp:30,weight:3,flavor:`Trägt einen Gürtel voller Dynamit. Raucht. Natürlich raucht er.`,tags:[`kobold`],abilities:[`explodiert`]},{id:`kellermeister`,name:`Skelett des Kellermeisters`,glyph:`K`,color:`#e0d8b0`,levels:[5,8],floors:[2],hp:26,hpPerLevel:6,dmg:[3,7],dmgPerLevel:1,treffer:75,ruestung:3,ausweichen:5,size:`mittel`,behavior:`melee`,xp:40,weight:2,flavor:`Hat 60 Jahre lang Wein bewacht. Wird es weitere 60 Jahre tun. Mit einer Schöpfkelle.`,tags:[`untot`],abilities:[`gepanzert`]},{id:`nachtmahr`,name:`Nachtmahr`,glyph:`N`,color:`#6040a0`,levels:[5,8],floors:[2],hp:22,hpPerLevel:5,dmg:[3,6],dmgPerLevel:1,treffer:75,ruestung:0,ausweichen:25,size:`mittel`,behavior:`melee`,xp:38,weight:2,flavor:`Setzt sich Schlafenden auf die Brust. Du schläfst nicht? Dann eben so.`,tags:[`geist`],abilities:[`fliegend`,`gift`,`furchterregend`]},{id:`ghulhund`,name:`Ghulhund`,glyph:`D`,color:`#9ab870`,levels:[4,7],floors:[2],hp:18,hpPerLevel:4,dmg:[3,5],dmgPerLevel:1,treffer:75,ruestung:0,ausweichen:15,size:`mittel`,behavior:`melee`,xp:28,weight:4,pack:[1,3],flavor:`Der Hund eines Ghuls. Treuer als der Ghul. Hungriger auch.`,tags:[`untot`],abilities:[`schnell`,`blutig`]},{id:`abtruenniger_crawler`,name:`Abtrünniger Crawler`,glyph:`@`,color:`#e0a060`,levels:[2,30],floors:[],hp:24,hpPerLevel:6,dmg:[3,6],dmgPerLevel:1,treffer:72,ruestung:1,ausweichen:10,size:`mittel`,behavior:`melee`,xp:40,weight:0,flavor:`Ein Mensch wie du. War einer. Jetzt will er nur noch deine Ausrüstung.`,tags:[`humanoid`,`crawler`]},{id:`wutelementar`,name:`Wutelementar`,glyph:`W`,color:`#ff2020`,levels:[15,30],floors:[],hp:250,hpPerLevel:20,dmg:[18,30],dmgPerLevel:2,treffer:95,ruestung:6,ausweichen:10,size:`gross`,behavior:`melee`,xp:500,weight:0,flavor:`Ein Wirbel aus purem Zorn, herbeigerufen von deinem Fehltritt. Die Regel war eindeutig. Nur in Toiletten.`,tags:[`elementar`],abilities:[`schnell`,`regeneriert`,`brennend`]},{id:`kanalkroko`,name:`Kanal-Krokodil`,glyph:`C`,color:`#608040`,levels:[7,11],floors:[3],hp:45,hpPerLevel:7,dmg:[5,9],dmgPerLevel:1,treffer:70,ruestung:3,ausweichen:0,size:`gross`,behavior:`melee`,xp:70,weight:3,flavor:`Jemand hat es als Baby das Klo hinuntergespült. Es hat nicht vergeben.`,tags:[`reptil`],abilities:[`gepanzert`,`blutig`]},{id:`fischmensch`,name:`Fischmensch`,glyph:`f`,color:`#60a0c0`,levels:[6,10],floors:[3],hp:28,hpPerLevel:6,dmg:[4,7],dmgPerLevel:1,treffer:75,ruestung:1,ausweichen:15,size:`mittel`,behavior:`melee`,xp:50,weight:6,pack:[1,3],flavor:`Glotzaugen, Kiemen, ein Dreizack aus einer Heugabel. Riecht, wie du es dir vorstellst.`,tags:[`aquatisch`]},{id:`morlock`,name:`Morlock`,glyph:`m`,color:`#c0c0a0`,levels:[6,9],floors:[3],hp:24,hpPerLevel:5,dmg:[4,6],dmgPerLevel:1,treffer:75,ruestung:1,ausweichen:15,size:`mittel`,behavior:`melee`,xp:44,weight:6,pack:[2,3],flavor:`Blasse Tunnelbewohner, lichtempfindlich, hungrig. Sehr, sehr hungrig.`,tags:[`humanoid`],abilities:[`rufer`]},{id:`klaerschlamm`,name:`Klärschlamm-Elementar`,glyph:`E`,color:`#806040`,levels:[7,11],floors:[3],hp:40,hpPerLevel:7,dmg:[4,8],dmgPerLevel:1,treffer:65,ruestung:0,ausweichen:0,size:`gross`,behavior:`melee`,xp:60,weight:3,flavor:`Du willst nicht wissen, woraus es besteht. Du weißt es trotzdem. Es ist giftig.`,tags:[`elementar`],abilities:[`gift`,`gepanzert`]},{id:`kanalhexe`,name:`Kanalhexe`,glyph:`H`,color:`#a060c0`,levels:[7,10],floors:[3],hp:22,hpPerLevel:5,dmg:[4,7],dmgPerLevel:1,treffer:75,ruestung:0,ausweichen:20,size:`mittel`,behavior:`ranged`,range:5,xp:55,weight:3,flavor:`Braut Tränke aus Abwasser. Wirft sie dir ins Gesicht. Die Tränke sind giftig, die Hexe auch.`,tags:[`hexe`],abilities:[`gift`,`blendend`]},{id:`pilzmensch`,name:`Sporenmensch`,glyph:`p`,color:`#d0a0a0`,levels:[6,9],floors:[3],hp:20,hpPerLevel:4,dmg:[3,6],dmgPerLevel:1,treffer:65,ruestung:0,ausweichen:5,size:`mittel`,behavior:`melee`,xp:42,weight:4,flavor:`Ein Pilz in Menschengestalt. Oder ein Mensch in Pilzgestalt. Platzt, wenn er stirbt.`,tags:[`pflanze`],abilities:[`explodiert`,`gift`]},{id:`mottenmann`,name:`Mottenmann`,glyph:`M`,color:`#b0a080`,levels:[8,11],floors:[3],hp:30,hpPerLevel:5,dmg:[5,8],dmgPerLevel:1,treffer:80,ruestung:0,ausweichen:30,size:`gross`,behavior:`melee`,xp:70,weight:2,flavor:`Rote Augen, riesige Flügel, eine unerklärliche Vorliebe für deine Taschenlampe.`,tags:[`kryptid`],abilities:[`fliegend`,`schnell`,`blutig`]},{id:`schmuggler`,name:`Schmuggler-Kobold`,glyph:`g`,color:`#ffd060`,levels:[6,9],floors:[3],hp:18,hpPerLevel:4,dmg:[3,6],dmgPerLevel:1,treffer:75,ruestung:1,ausweichen:25,size:`klein`,behavior:`melee`,xp:40,weight:4,flavor:`Verkauft dir alles. Klaut dir alles. Oft in derselben Minute.`,tags:[`kobold`],abilities:[`diebisch`,`schnell`]},{id:`neunauge`,name:`Riesen-Neunauge`,glyph:`n`,color:`#8080a0`,levels:[7,10],floors:[3],hp:26,hpPerLevel:5,dmg:[4,7],dmgPerLevel:1,treffer:75,ruestung:0,ausweichen:10,size:`mittel`,behavior:`melee`,xp:50,weight:3,flavor:`Ein Maul voller Zahnringe an einem Aal. Saugt sich fest. Saugt dich aus.`,tags:[`aquatisch`],abilities:[`regeneriert`,`blutig`]},{id:`taubenschwarm`,name:`Mutierte Stadttaube`,glyph:`t`,color:`#a0a0b0`,levels:[6,9],floors:[3],hp:12,hpPerLevel:3,dmg:[3,5],dmgPerLevel:1,treffer:75,ruestung:0,ausweichen:30,size:`klein`,behavior:`melee`,xp:30,weight:5,pack:[2,4],flavor:`Tauben waren schon vorher Ratten mit Flügeln. Jetzt haben sie auch Zähne.`,tags:[`tier`],abilities:[`fliegend`,`blendend`]}],te=[{id:`die_sammlerin`,name:`Die Sammlerin`,glyph:`S`,color:`#e070e0`,level:7,hp:70,dmg:[4,7],treffer:75,ruestung:2,ausweichen:5,size:`gross`,xp:120,rank:`nachbarschaftsboss`,floors:[1],abilities:[`diebisch`],intro:`Zwischen Türmen aus Zeitungen, Katzenfutterdosen und Porzellanpuppen erhebt sich etwas. Es hat zu viele Arme – und in jedem eine Handtasche.`,flavor:`Hat noch nie etwas weggeworfen. Wird auch dich nicht wegwerfen. Sie wird dich *behalten*.`,loot:[`handtasche_der_sammlerin`]},{id:`der_hausmeister`,name:`Der Hausmeister`,glyph:`H`,color:`#70a0e0`,level:7,hp:80,dmg:[4,8],treffer:70,ruestung:3,ausweichen:0,size:`gross`,xp:130,rank:`nachbarschaftsboss`,floors:[1,2],intro:`Ein drei Meter großer Mann im grauen Kittel dreht sich um. Sein Wischmopp tropft. „Hier wird nicht gelaufen!“`,flavor:`Seit 40 Jahren im Dienst. Hat jeden einzelnen Tag gehasst.`,loot:[`wischmopp`],abilities:[`furchterregend`]},{id:`koenig_kanalratte`,name:`König der Kanalratten`,glyph:`K`,color:`#c0a060`,level:8,hp:75,dmg:[5,8],treffer:75,ruestung:1,ausweichen:15,size:`gross`,xp:140,rank:`nachbarschaftsboss`,floors:[1],abilities:[`rufer`],intro:`Ein Knoten aus sieben Ratten, deren Schwänze verwachsen sind, trägt eine Krone aus Kronkorken. Er quiekt in sieben Stimmen.`,flavor:`Ein Rattenkönig im wörtlichsten Sinne. Die sieben Köpfe sind sich selten einig.`,loot:[`kronkorkenkrone`]},{id:`muttis_mixer`,name:`Muttis Mega-Mixer`,glyph:`M`,color:`#e0e0e0`,level:8,hp:65,dmg:[5,9],treffer:70,ruestung:4,ausweichen:0,size:`gross`,xp:140,rank:`nachbarschaftsboss`,floors:[1,2],abilities:[`gepanzert`],intro:`Ein Küchengerät von der Größe eines Kleinwagens erwacht brummend. Die Rührbesen drehen sich. Es riecht nach Rührkuchen und Tod.`,flavor:`Stufe 1: Sahne. Stufe 2: Eischnee. Stufe 3: dich.`,loot:[`ruehrbesen`]},{id:`kesselkoenigin`,name:`Oma Gulasch, die Kesselkönigin`,glyph:`O`,color:`#ff8040`,level:10,hp:160,dmg:[6,11],treffer:75,ruestung:3,ausweichen:5,size:`riesig`,range:4,xp:400,rank:`boroughboss`,floors:[1],intro:`In der Mitte des Gewölbes steht ein Kessel, groß wie ein Pool. Eine riesige alte Frau rührt darin und dreht sich langsam um. „Du bist aber dünn geworden. Komm, iss was.“`,flavor:`Wirft kochendes Gulasch. Die Treppe nach unten ist direkt hinter ihr.`,loot:[`schoepfkelle`,`omas_schuerze`],abilities:[`brennend`]},{id:`kammerjaeger`,name:`Der Kammerjäger`,glyph:`J`,color:`#a0e060`,level:7,hp:65,dmg:[4,7],treffer:75,ruestung:2,ausweichen:10,size:`gross`,range:3,xp:130,rank:`nachbarschaftsboss`,floors:[1,2],abilities:[`gift`],intro:`Eine Gestalt im Schutzanzug mit Gasmaske und Sprühtank. „Ungeziefer entdeckt“, zischt es aus dem Filter. Es meint dich.`,flavor:`Hat sein Leben lang Schädlinge vergiftet. Hält dich für einen. Hat vielleicht recht.`,loot:[`gasmaske`]},{id:`mottenmutter`,name:`Mutter aller Motten`,glyph:`V`,color:`#d0c090`,level:7,hp:60,dmg:[4,7],treffer:80,ruestung:0,ausweichen:20,size:`gross`,xp:130,rank:`nachbarschaftsboss`,floors:[1,2],abilities:[`fliegend`,`rufer`],intro:`Der Raum ist voller zerfressener Pelzmäntel. An der Decke hängt etwas mit einer Flügelspannweite von vier Metern. Es hat Hunger. Auf Wolle. Und auf dich.`,flavor:`Hat jeden Wollpullover dieser Stadt gefressen. Du trägst Baumwolle? Egal.`,loot:[`mottenfluegel_umhang`]},{id:`pfandbaron`,name:`Der Pfandflaschen-Baron`,glyph:`B`,color:`#60c0a0`,level:8,hp:75,dmg:[4,8],treffer:70,ruestung:3,ausweichen:0,size:`gross`,range:4,xp:140,rank:`nachbarschaftsboss`,floors:[1,2],intro:`Berge aus leeren Flaschen, sortiert nach Pfandwert. Auf dem höchsten Berg thront ein Mann aus Glas und Etiketten. „25 Cent pro Knochen!“, ruft er.`,flavor:`Wirft Flaschen. Sammelt sie wieder ein. Wirft sie wieder. Kreislaufwirtschaft.`,loot:[`pfandkrone`]},{id:`heizungsbestie`,name:`Die Heizungsbestie`,glyph:`F`,color:`#ff6030`,level:8,hp:85,dmg:[5,8],treffer:70,ruestung:4,ausweichen:0,size:`riesig`,xp:150,rank:`nachbarschaftsboss`,floors:[1,2],abilities:[`gepanzert`,`regeneriert`,`brennend`],intro:`Ein Heizkessel aus den 60ern hat Beine bekommen. Und Zähne. Und schlechte Laune. Es wird sehr warm.`,flavor:`Wurde nie gewartet. Hat es sich gemerkt.`,loot:[`thermostat_amulett`]},{id:`hausverwalter`,name:`Der Hausverwalter`,glyph:`V`,color:`#ffb030`,level:12,hp:200,dmg:[7,12],treffer:75,ruestung:4,ausweichen:5,size:`riesig`,range:5,xp:600,rank:`boroughboss`,floors:[2],abilities:[`rufer`],intro:`Hinter einem Schreibtisch aus Mietverträgen sitzt ein aufgedunsener Mann mit vier Armen. Jeder Arm hält einen Stempel. „Sie sind mit der Miete im Rückstand. Seit der Apokalypse.“`,flavor:`Wirft Nebenkostenabrechnungen. Die schneiden tiefer als Messer.`,loot:[`generalschluessel`,`verwalter_stempel`]},{id:`kanalkoenigin`,name:`Die Kanalkönigin`,glyph:`Q`,color:`#40c0a0`,level:12,hp:150,dmg:[6,10],treffer:75,ruestung:3,ausweichen:15,size:`riesig`,xp:350,rank:`nachbarschaftsboss`,floors:[3],abilities:[`gift`,`regeneriert`,`furchterregend`],intro:`Aus dem Wasser erhebt sich eine gewaltige Schlangenfrau mit einer Krone aus verrosteten Gullydeckeln. „Wer hat hier ohne zu fragen gespült?“`,flavor:`Herrscherin über alles, was durch die Rohre kommt. Also über sehr viel Ekliges.`,loot:[`gullydeckel_schild`]},{id:`kommandant_schlamm`,name:`Kommandant Klärschlamm`,glyph:`K`,color:`#a08040`,level:12,hp:170,dmg:[6,11],treffer:70,ruestung:4,ausweichen:0,size:`riesig`,xp:350,rank:`nachbarschaftsboss`,floors:[3],abilities:[`gepanzert`,`rufer`],intro:`Ein Berg aus Schlamm mit einer Offiziersmütze. Um ihn herum stehen kleinere Schlammhaufen stramm. „ACHTUNG!“`,flavor:`Führt eine Armee aus Abfall. Die Armee ist loyal. Und klebrig.`,loot:[`offiziersmuetze`]},{id:`schwarzmarkt_oger`,name:`Der Schwarzmarkt-Oger`,glyph:`O`,color:`#c09060`,level:13,hp:180,dmg:[7,12],treffer:70,ruestung:3,ausweichen:0,size:`riesig`,xp:380,rank:`nachbarschaftsboss`,floors:[3],abilities:[`diebisch`,`furchterregend`],intro:`Zwischen Kisten mit geklauten Waren sitzt ein Oger mit Goldzähnen und Bauchtasche. „Du kaufst nix? Dann bist DU die Ware.“`,flavor:`Hat alles. Verkauft alles. Klaut den Rest.`,loot:[`bauchtasche`]},{id:`nixe`,name:`Die Nixe vom Überlauf`,glyph:`N`,color:`#60e0ff`,level:12,hp:140,dmg:[6,10],treffer:80,ruestung:1,ausweichen:25,size:`gross`,range:5,xp:350,rank:`nachbarschaftsboss`,floors:[3],abilities:[`fliegend`],intro:`Ein wunderschöner Gesang hallt durch das Gewölbe. Dann siehst du die Sängerin: halb Frau, halb Hecht. Mit sehr, sehr vielen Zähnen.`,flavor:`Singt Seeleute in den Tod. Mangels Seeleuten: dich.`,loot:[`muschelhorn`]},{id:`rattenkaiser`,name:`Der Rattenkaiser`,glyph:`R`,color:`#ffd700`,level:15,hp:320,dmg:[8,14],treffer:75,ruestung:4,ausweichen:10,size:`riesig`,range:4,xp:1e3,rank:`boroughboss`,floors:[3],abilities:[`rufer`,`regeneriert`,`blutig`,`furchterregend`],intro:`Auf einem Thron aus Fahrradreifen und Knochen sitzt eine Ratte so groß wie ein Bus, in einen Königsmantel aus Duschvorhängen gehüllt. Tausende kleine Augen leuchten im Dunkeln.`,flavor:`Der Herrscher der Kanalstadt. Hinter ihm: die Treppe nach unten.`,loot:[`kaiserzepter`,`duschvorhang_mantel`]}],ne={glyph:`@`,color:`#b0f0ff`},re=`Der Große Abstieg`,ie=[`Nordwestviertel`,`Nordostviertel`,`Südostviertel`,`Südwestviertel`],ae=[{floor:1,name:`Die Kellergewölbe`,intro:`Unter den Trümmern deiner Stadt hat der Dungeon die Keller aller Häuser zu einem einzigen, endlosen Labyrinth verbunden. Es riecht nach Moder, Heizöl und etwas Totem. Irgendwo tropft es. Irgendwo knurrt es.`,duration:2400,mobLevel:[1,5]},{floor:2,name:`Die tieferen Keller`,intro:`Die zweite Etage sieht aus wie die erste – nur dunkler, feuchter und mit mehr Zähnen. Die Systemstimme verspricht „spannende neue Features“. Das klingt nicht gut.`,duration:2400,mobLevel:[3,7]},{floor:3,name:`Die Kanalstadt`,intro:`Unter den Kellern liegt die Kanalisation – und in ihr eine ganze Stadt. Brücken über Abwasserkanäle, Hütten aus Treibgut, Märkte in Pumpwerken. Hier leben Dinge, die das Tageslicht nie gesehen haben. Und sie haben Hunger.`,duration:2400,mobLevel:[6,11],flavors:[{name:`Pumpwerk`,description:`Riesige Kolben stehen still. In ihren Schatten wohnt etwas, das bei jedem Geräusch zusammenzuckt. Oder zuschnappt.`},{name:`Überlaufbecken`,description:`Ein See aus trübem Wasser. Blasen steigen auf. Nicht alle davon sind Gas.`},{name:`Schwarzmarkt-Gasse`,description:`Verlassene Stände, handgemalte Schilder: „Nieren – fast neu“, „Hoffnung – ausverkauft“.`},{name:`Morlock-Siedlung`,description:`Hütten aus Mülltonnen und Autotüren. Ein Kochtopf blubbert. Du willst nicht wissen, was drin ist.`},{name:`Klärbecken`,description:`Der Gestank ist so dicht, dass man ihn anlehnen könnte.`},{name:`Gewölbe der Rohre`,description:`Tausende Rohre, die sich wie Adern durch die Wände ziehen. Manche pulsieren.`},{name:`Rattenmarkt`,description:`Kleine Stände, betrieben von Ratten in Westen. Sie sind geflohen, als du kamst. Ihre Ware liegt noch da.`},{name:`Alte U-Bahn-Wartungshalle`,description:`Ein verrosteter Waggon, halb im Wasser. Auf der Anzeige: „Zug fällt aus“. Für immer.`},{name:`Kanalkapelle`,description:`Ein Altar aus Gullydeckeln. Davor Opfergaben: Socken, Schlüssel, ein einzelner Ohrring.`},{name:`Schmugglerversteck`,description:`Kisten mit gestohlenen Waren und eine Karte mit roten Kreuzen. Eines davon ist hier.`},{name:`Krokodilnest`,description:`Eier, so groß wie Medizinbälle. Eines hat einen Riss. Etwas darin klopft.`},{name:`Wasserrad-Mühle`,description:`Ein Rad dreht sich im Abwasserstrom und mahlt… Knochen? Knochen.`},{name:`Pilzgarten`,description:`Riesige, bleiche Pilze, zwischen denen feiner Sporennebel hängt. Atme nicht zu tief.`},{name:`Taubenschlag`,description:`Tausende Federn, tausende Augen. Das Gurren klingt wie ein Knurren.`},{name:`Brücke über den Hauptkanal`,description:`Eine wackelige Konstruktion aus Paletten. Unter dir fließt etwas, das früher eine Stadt war.`},{name:`Verlassene Taverne „Zum Gully“`,description:`Stühle auf den Tischen, als hätte jemand gerade aufgeräumt. Hinter dem Tresen: ein Schatten.`}]}],oe={name:`Am Fuß der Treppe`,description:`Die Treppe hinter dir zerbröselt zu Staub. Kein Zurück. Vor dir: die neue Etage.`},se=[{name:`Heizungskeller`,description:`Ein verrosteter Öltank gluckert vor sich hin. Die Rohre an der Decke sind warm und schwitzen.`},{name:`Waschküche`,description:`Drei Waschmaschinen stehen offen, in einer dreht sich noch etwas. Es ist hoffentlich Wäsche.`},{name:`Weinkeller`,description:`Zerbrochene Flaschen, der Boden klebt. Es riecht nach Rotwein und schlechten Entscheidungen.`},{name:`Abstellkammer`,description:`Kartons mit der Aufschrift „Weihnachten“, „Oma“ und „NICHT ÖFFNEN“. Einer davon bewegt sich.`},{name:`Fahrradkeller`,description:`Verbogene Fahrräder hängen wie Skelette an Wandhaken. Ein Kinderrad hat noch eine Klingel.`},{name:`Partykeller`,description:`Eine Discokugel dreht sich, obwohl es keinen Strom gibt. An der Wand: „Happy 50, Uwe!“`},{name:`Hobbyraum`,description:`Eine halbfertige Modelleisenbahn. Die kleinen Figuren wurden alle geköpft.`},{name:`Vorratskeller`,description:`Regale mit Einmachgläsern. Das meiste ist verdorben. Etwas im Gurkenglas blinzelt.`},{name:`Tiefgaragen-Ausläufer`,description:`Betonpfeiler, Ölflecken, ein ausgebranntes Auto. Die Parkuhr zeigt „ABGELAUFEN“. Passt.`},{name:`Luftschutzbunker`,description:`Dicke Stahltür, alte Feldbetten, ein Schild: „Ruhe bewahren“. Ha.`},{name:`Kohlenkeller`,description:`Schwarzer Staub auf allem. Deine Füße hinterlassen Abdrücke, die sehr gut zu verfolgen sind.`},{name:`Werkstatt`,description:`Eine Werkbank voller Werkzeug, das jemand fest verschraubt hat. Wie gemein.`},{name:`Archivraum`,description:`Aktenordner bis zur Decke. „Nebenkostenabrechnung 1987–2019“. Die Hölle hat eine Registratur.`},{name:`Hausmeisterkammer`,description:`Eimer, Besen, ein Kalender mit Katzenbildern von vor fünf Jahren.`},{name:`Sauna`,description:`Holzbänke, ein kalter Ofen, ein Handtuch mit der Aufschrift „Gast“. Die Temperatur ist merkwürdig angenehm.`},{name:`Kellerbar`,description:`Ein Tresen aus Europaletten, eine Dartscheibe mit einem Messer darin. Nicht mit einem Pfeil. Mit einem Messer.`},{name:`Hobbyschmiede`,description:`Ein Amboss steht mitten im Raum. Wer hat im Keller einen Amboss? Und warum?`},{name:`Kinderzimmer im Keller`,description:`Ein Hochbett, Poster von Bands, die es nicht mehr gibt. Eine Spieluhr spielt von selbst.`},{name:`Überfluteter Gang`,description:`Knöcheltiefes, schwarzes Wasser. Etwas schwimmt vorbei. Du entscheidest dich, nicht hinzusehen.`},{name:`Gemeinschaftskeller`,description:`Nummerierte Holzverschläge, hinter jedem das Leben einer Familie in Kisten.`},{name:`Wäschetrockenraum`,description:`Leinen voller Bettlaken, die sich bewegen, obwohl kein Luftzug geht. Hinter einem steht etwas. Oder nicht.`},{name:`Hobbykeller mit Tischtennisplatte`,description:`Das Netz ist zerrissen. Auf der Platte: ein Blutfleck in Form eines Schlägers.`},{name:`Musikprobenraum`,description:`Eierkartons an den Wänden, ein Schlagzeug ohne Felle. Ein Plakat: „Die Kellerkinder – Tour 2003“.`},{name:`Heimkino`,description:`Drei Reihen Kinosessel, eine zerrissene Leinwand. Der Projektor zeigt immer noch das Menü einer DVD.`},{name:`Fitnesskeller`,description:`Hanteln, eine Rudermaschine, ein Spiegel mit Sprung. Irgendwer hat hier „No Pain No Gain“ an die Wand geschrieben. Mit Blut.`},{name:`Öltanklager`,description:`Riesige Kunststofftanks. Es riecht so stark nach Heizöl, dass dir schwindelig wird.`},{name:`Schutzraum der Grundschule`,description:`Kleine Stühle, Buntstiftzeichnungen an den Wänden. Auf einer: ein Monster mit sehr vielen Zähnen. Es sieht erschreckend realistisch aus.`},{name:`Kartoffelkeller`,description:`Ein Berg keimender Kartoffeln. Die Keime sind einen Meter lang und zucken leicht.`},{name:`Weinprobierstube`,description:`Ein Eichentisch, zwölf Gläser, alle halb voll. Wer hier saß, ist sehr plötzlich gegangen.`},{name:`Modelleisenbahn-Paradies`,description:`Eine komplette Miniaturstadt. Jemand hat kleine Monster dazwischengestellt. Handbemalt.`},{name:`Kellerbüro`,description:`Ein Schreibtisch, ein Röhrenmonitor, ein Faxgerät, das gelegentlich piept. Auf dem Papier: „Kündigung“.`},{name:`Pilzzucht`,description:`Regale voller leuchtender Pilze. Das Licht ist angenehm. Das Geräusch, das sie machen, weniger.`},{name:`Kegelbahn im Keller`,description:`Eine einzelne, uralte Kegelbahn. Alle Kegel liegen. Irgendwer hat zuletzt alle Neune geworfen.`},{name:`Aufzugsschacht`,description:`Die Tür steht offen. Kein Aufzug, nur Kabel, die in die Dunkelheit hängen. Von unten kommt ein Geräusch. Wie Kauen.`},{name:`Hausmeisterwerkstatt`,description:`Schraubenzieher, sortiert nach Größe. Ein Kalender von 1994. Ein Radio spielt leise Schlager.`},{name:`Sickergrube`,description:`Ein Gitter im Boden, darunter gurgelt es. Der Geruch hat eine eigene Persönlichkeit.`},{name:`Weihnachtsdeko-Lager`,description:`Kisten voller Kugeln, Lametta und ein aufblasbarer Weihnachtsmann, der sich langsam zu dir dreht.`},{name:`Kellerkapelle`,description:`Ein kleiner Altar, Kerzen, die von selbst brennen. Auf dem Gästebuch steht nur: „Hilfe“.`},{name:`Serverraum`,description:`Blinkende Lämpchen, obwohl es keinen Strom mehr gibt. Die Lüfter summen ein Lied.`},{name:`Aquarienkeller`,description:`Dutzende Aquarien, trüb und grün. In einem schwimmt etwas, das zu groß für das Becken ist.`}],ce={name:`Dein eigener Keller`,description:`Hier bist du hinuntergerannt, als der Himmel aufriss. Die Treppe nach oben ist verschwunden – an ihrer Stelle nur Beton. Es gibt nur einen Weg: weiter.`},le={name:`Gilde der Einweisung`,description:`Ein holzvertäfelter Saal voller Pokale, ausgestopfter Monsterköpfe und eines Kamins, der kein Holz braucht. Hinter einem Tresen wartet jemand auf dich.`},ue={name:`Safe Room – Die Gratis-Kammer`,description:`Ein schimmerndes Feld an der Tür. Drinnen: ein bequemes Sofa, ein Waschbecken und ein Podest mit einem glänzenden Automaten. „EIN GRATIS-GEGENSTAND PRO CRAWLER!“ steht darauf.`},de={name:`Safe Room – Restaurant`,description:`Ein schimmerndes Feld an der Tür. Drinnen: warme Luft, Holztische und der Geruch von Bratkartoffeln. Hinter der Theke steht ein NPC und poliert ein Glas.`},fe=[{name:`Brunhilde`,race:`Halbtroll`,greeting:`„Setz dich hin, du siehst aus wie ausgekotzt. Was darf’s sein?“`},{name:`Gustav`,race:`Gnom`,greeting:`„Willkommen, willkommen! Heute im Angebot: alles, was noch nicht weggelaufen ist!“`},{name:`Zorla`,race:`Echsenfrau`,greeting:`„Frischfleisch! Ah, nein, ich meine: ein Gast. Ein Gast! Hunger?“`},{name:`Herr Pütz`,race:`Mensch (?)`,greeting:`„Wir nehmen nur Bargeld. Und Seelen. Scherz! Nur Bargeld.“`}],pe=[{id:`menue_suppe`,name:`Tagessuppe`,price:3,effekt:{heal:12,blase:10},flavor:`Undefinierbar, aber heiß.`},{id:`menue_schnitzel`,name:`Schnitzel mit Pommes`,price:8,effekt:{heal:25,buff:{name:`Satt & zufrieden`,turns:120,bonuses:{maxHp:5,stats:{str:1}}}},flavor:`Paniert. Das Tier dahinter: unbekannt.`},{id:`menue_kaffee`,name:`Starker Kaffee`,price:2,effekt:{ausdauer:15,blase:15,buff:{name:`Wach`,turns:80,bonuses:{treffer:5}}},flavor:`Schwarz wie deine Zukunft.`},{id:`menue_salat`,name:`Kellerpilz-Salat`,price:5,effekt:{heal:10,buff:{name:`Pilzkraft`,turns:120,bonuses:{ausweichen:5,stats:{ges:1}}}},flavor:`Die Pilze leuchten leicht. Das ist normal. Sagt der Koch.`},{id:`menue_gulasch`,name:`Monster-Gulasch`,price:10,effekt:{heal:30,buff:{name:`Monsterkraft`,turns:150,bonuses:{schaden:{alle:15}}}},flavor:`Aus Zutaten, die du heute selbst erschlagen hast. Vielleicht.`}],me={bronze:`Bronze`,silber:`Silber`,gold:`Gold`,platin:`Platin`,legendaer:`Legendäre`,himmlisch:`Himmlische`},he={bronze:`#cd7f32`,silber:`#c0c0c0`,gold:`#ffd700`,platin:`#9fe8ff`,legendaer:`#ff9d2e`,himmlisch:`#e0b0ff`},ge=[`bronze`,`silber`,`gold`,`platin`,`legendaer`,`himmlisch`],_e={abenteurer:`Abenteurer-Box`,waffen:`Waffen-Box`,schuh:`Schuh-Box`,kleidung:`Kleidungs-Box`,schmuck:`Schmuck-Box`,haustier:`Haustier-Box`,boss:`Boss-Box`,brawler:`Schläger-Box`,wurf:`Wurf-Box`,ueberlebens:`Überlebens-Box`,fan:`Fan-Box`},ve={bronze:{items:[1,1],rarities:[[`gewoehnlich`,60],[`ungewoehnlich`,35],[`selten`,5]],gold:[2,8],uniqueChance:0},silber:{items:[1,2],rarities:[[`gewoehnlich`,25],[`ungewoehnlich`,50],[`selten`,22],[`episch`,3]],gold:[5,15],uniqueChance:.01},gold:{items:[2,2],rarities:[[`ungewoehnlich`,35],[`selten`,45],[`episch`,18],[`legendaer`,2]],gold:[15,40],uniqueChance:.04},platin:{items:[2,3],rarities:[[`selten`,45],[`episch`,43],[`legendaer`,12]],gold:[40,100],uniqueChance:.1},legendaer:{items:[3,3],rarities:[[`episch`,55],[`legendaer`,40],[`himmlisch`,5]],gold:[100,250],uniqueChance:.3},himmlisch:{items:[3,4],rarities:[[`legendaer`,60],[`himmlisch`,40]],gold:[300,800],uniqueChance:.6}},ye={name:`Barnabas`,description:`ein hageres Wesen, halb Reiher, halb Buchhalter, mit einer Lesebrille auf dem Schnabel`};function be(e,t,n){return[n?`Hinter dem Tresen steht ${e}. Du kennst das Gesicht – es ist ein früherer Crawler aus einer vergangenen Staffel. Einer von *deinen*. Mit einem unterschriebenen Vertrag dient ${e} jetzt der Show. „Hätte nicht gedacht, dass wir uns so wiedersehen“, sagt er. „Ich gebe dir alles mit, was ich weiß.“`:`Hinter dem Tresen steht ${t}. „Ah. Ein Neuer. Ich bin ${e}, dein Guide. Ich war mal wie du – ein Crawler. Dann habe ich einen Vertrag unterschrieben. Jetzt sitze ich hier und erkläre Leuten, wie sie nicht sterben. Die meisten hören nicht zu.“`,`„Also, die Grundlagen. Du bist in einer Gameshow. Die ganze Galaxis schaut zu. Jede Etage hat einen Timer – wenn er abläuft, stürzt die Etage ein. Bist du dann nicht im Treppenhaus, bist du tot. Punkt.“`,`„Ab jetzt hast du ein Inventar. Du kannst also mehr tragen als das, was du in der Hand hältst. Glückwunsch. Außerdem siehst du jetzt deine Werte, und deine Karte merkt sich, wo du schon warst.“`,`„Kämpfen: Die Systemstimme beobachtet, WIE du kämpfst. Tritt viel, und du wirst besser im Treten. Wirf Steine, und du wirst besser im Werfen. Probier Dinge aus. Wer immer dasselbe macht, wird darin gut – aber auch vorhersehbar.“`,`„Bosse: Jedes Viertel hat einen Nachbarschafts-Boss. Solange er lebt, spawnen dort neue Monster nach. Er verlässt seine Kammer nicht. Wenn du ihn tötest, lässt er eine Gebietskarte fallen – heb sie auf. Und in der Mitte der Etage haust etwas Größeres. Die Treppe liegt direkt hinter ihm.“`,`„Safe Rooms erkennst du am grünen Schimmern. Dort darf niemand Gewalt anwenden. Monster, die dich dort angreifen, werden weggebeamt. Nur dort kannst du Lootboxen öffnen. Und schlafen. Schlaf ist wichtig. Tot sein ist schlimmer.“`,`„Achievements bekommst du für… alles Mögliche. Je verrückter oder schwieriger, desto besser die Box. Die Systemstimme hat einen, äh, speziellen Humor. Gewöhn dich dran.“`,`„Du hast jetzt auch Mana – so viel, wie du Intelligenz hast. Ich schenke dir den Zauber Heilen. Weitere Zauber lernst du aus Zauberbüchern. Das Buch zerfällt beim Lesen, der Zauber bleibt. Tränke helfen auch, aber dein Körper verträgt nur alle paar Minuten einen.“`,`„Und jetzt die wichtigste Regel des ganzen Dungeons. Ich meine das ernst. Du darfst dich NUR in einer Toilette erleichtern. In jedem Safe Room gibt es eine. Wer es nicht rechtzeitig schafft, ruft ein Wutelementar herbei. Die haben noch nie jemanden am Leben gelassen. Behalte deine Blase im Auge.“`,`„Letzte Sache. Wenn du stirbst, ist es vorbei. Keine zweite Runde für dich. Aber… die Show merkt sich alles. Und wer weiß, vielleicht begegnest du dir irgendwann selbst wieder. Viel Glück. Du wirst es brauchen.“`]}var xe=[`Du bist jetzt stärker! Relativ gesehen. Absolut gesehen bist du immer noch Futter.`,`Level up! Die Zuschauer klatschen. Einige davon haben keine Hände, aber sie versuchen es.`,`Aufgestiegen! Die Systemstimme hat Wetten auf deinen Tod laufen. Sie ist leicht verunsichert.`,`Neues Level. Neue Möglichkeiten. Neue Arten zu sterben.`],Se=[`Und das war es dann. Die Galaxis hat kurz hingesehen, gelacht und umgeschaltet.`,`Ein weiterer Crawler, der es nicht geschafft hat. Die Systemstimme vermerkt es. Mit einem Smiley.`,`Du wirst nicht vergessen werden. Zumindest nicht, bis die Werbepause vorbei ist.`,`Deine Einschaltquote im Moment deines Todes: beachtlich. Glückwunsch, posthum.`],Ce=[[480,`Noch 24 Stunden bis zum Einsturz der Etage. Kein Grund zur Panik. Noch nicht.`],[120,`Noch 6 Stunden bis zum Einsturz! Die Treppenhäuser freuen sich auf deinen Besuch.`],[20,`NOCH EINE STUNDE! Safe Rooms werden geräumt. Lauf, Crawler, lauf!`],[5,`Die Decke bröckelt. Das ist kein Scherz. Die Systemstimme scherzt nie. Na gut, oft. Aber jetzt nicht.`]],we={wutanfall:{name:`Wutanfall`,description:`+50 % Schaden, −10 % Ausweichen für 8 Züge.`,cooldown:40},wirbelwind:{name:`Wirbelwind`,description:`Greift alle angrenzenden Gegner mit deiner gewählten Technik an.`,cooldown:25},erdbeben:{name:`Erdbeben`,description:`Stampft auf den Boden: alle Gegner im Umkreis von 2 Feldern nehmen Schaden und fallen um.`,cooldown:35},kampfschrei:{name:`Kampfschrei`,description:`Alle Gegner in Sichtweite geraten in Furcht (Bosse nicht), du erhältst +20 % Schaden für 10 Züge.`,cooldown:45},bollwerk:{name:`Bollwerk`,description:`+6 Rüstung für 10 Züge.`,cooldown:40,peaceful:!0},schattenschritt:{name:`Schattenschritt`,description:`Alle Gegner verlieren dich aus den Augen, dein nächster Angriff ist ein Hinterhalt (+50 % Schaden, 5 Züge).`,cooldown:40},steinhagel:{name:`Steinhagel`,description:`Magische Steine treffen bis zu 4 sichtbare Gegner in Wurfreichweite.`,cooldown:30},bombe:{name:`Selbstgebaute Bombe`,description:`Explodiert beim nächsten sichtbaren Gegner und trifft alles im Umkreis.`,cooldown:35},heilung:{name:`Zweite Luft`,description:`Heilt 40 % deiner max. HP und dein Haustier vollständig.`,cooldown:60,peaceful:!0},showtime:{name:`Showtime!`,description:`Eine spektakuläre Pose: viele neue Follower und ein Geschenk aus dem Publikum.`,cooldown:80,peaceful:!0},blutrausch:{name:`Blutrausch`,description:`8 Züge lang lässt jeder Treffer bluten, dazu +15 % Schaden.`,cooldown:40},gnadenstoss:{name:`Gnadenstoß`,description:`3 Züge lang: Treffer gegen Gegner unter 35 % Lebenspunkten richten dreifachen Schaden an.`,cooldown:30},giftwolke:{name:`Giftwolke`,description:`Eine grüne Wolke um den nächsten sichtbaren Gegner vergiftet alles im Umkreis von 2 Feldern.`,cooldown:35},brandsatz:{name:`Brandsatz`,description:`Setzt alle Gegner im Umkreis von 2 Feldern in Brand.`,cooldown:40},blitzlicht:{name:`Blitzlicht`,description:`Ein greller Blitz blendet alle sichtbaren Gegner im Umkreis von 4 Feldern.`,cooldown:35},meditation:{name:`Meditation`,description:`Volle Ausdauer, die Hälfte des Manas zurück und +10 % Ausweichen für 6 Züge.`,cooldown:50,peaceful:!0},rudelruf:{name:`Rudelruf`,description:`Dein Haustier ist sofort wieder da, voll geheilt und richtet 10 Züge lang doppelten Schaden an.`,cooldown:45,peaceful:!0},zeitlupe:{name:`Zeitlupe`,description:`Alle sichtbaren Gegner bewegen sich 6 Züge lang wie in Sirup.`,cooldown:45},rauchbombe:{name:`Rauchbombe`,description:`Blendet alle angrenzenden Gegner, alle anderen verlieren dich aus den Augen.`,cooldown:40},langfinger:{name:`Langfinger`,description:`Klaut einem angrenzenden Gegner Gold und manchmal einen Gegenstand.`,cooldown:25},notreparatur:{name:`Notreparatur`,description:`Dein Reittier ist sofort wieder einsatzbereit und voll repariert, dazu +4 Rüstung für 10 Züge.`,cooldown:60,peaceful:!0},motivationsrede:{name:`Motivationsrede`,description:`Party und Haustier heilen 30 %, alle (du auch) richten 10 Züge lang +15 % Schaden an.`,cooldown:60,peaceful:!0},arkanschild:{name:`Arkaner Schild`,description:`Ein Schild aus Mana fängt 10 + 2 pro Intelligenz + Stufe Schaden ab (30 Züge).`,cooldown:45,peaceful:!0},manaflut:{name:`Manaflut`,description:`Füllt dein ft`,category:`ueberleben`,box:`ueberlebens`,text:`Entschärfe {n} Fallen.`,value:e=>e.counters.trapsDisarmed,stages:[{n:5,name:`Ruhige Hände`,tier:`bronze`},{n:20,name:`Kampfmittelräumdienst`,tier:`silber`}]},{id:`fallen_ausgeloest`,category:`ueberleben`,box:`ueberlebens`,text:`Löse {n} Fallen selbst aus.`,value:e=>e.counters.trapsTriggered,stages:[{n:3,name:`Pechsträhne`,tier:null},{n:10,name:`Fallenmagnet`,tier:`bronze`,comment:`Zehn Fallen. Mit dem eigenen Körper. Die Systemstimme hat dir eine Taschenlampe geschickt. Aus Mitleid.`}]},{id:`verbandszeug`,category:`ueberleben`,box:`ueberlebens`,text:`Überstehe {n} Zustände wie Blutung, Brennen, Furcht oder Blindheit.`,value:C(`zustand.erlitten`),stages:[{n:10,name:`Hart im Nehmen`,tier:`bronze`},{n:50,name:`Wandelndes Lazarett`,tier:`silber`}]},{id:`befreit`,category:`ueberleben`,box:`ueberlebens`,text:`Befreie dich {n}-mal aus einer Falle.`,value:C(`befreit`),stages:[{n:5,name:`Houdini`,tier:`silber`}]},{id:`gezaubert`,category:`magie`,box:`abenteurer`,text:`Wirke {n} Zauber.`,value:C(`zauber.gewirkt`),stages:[{n:10,name:`Fingerübungen`,tier:`bronze`},{n:50,name:`Zauberkundig`,tier:`silber`},{n:200,name:`Magieverschwendung`,tier:`gold`}]},{id:`zauber_gelernt`,category:`magie`,box:`abenteurer`,text:`Beherrsche {n} verschiedene Zauber.`,value:e=>e.player.spells?.length??0,stages:[{n:2,name:`Bücherwurm`,tier:`bronze`},{n:5,name:`Zauberbibliothek`,tier:`silber`},{n:9,name:`Allwissend`,tier:`gold`}]},{id:`gebaut`,category:`handwerk`,box:`wurf`,text:`Stelle {n} Dinge her.`,value:e=>e.counters.crafted,stages:[{n:5,name:`Heimwerken`,tier:`bronze`},{n:25,name:`Tüftelei`,tier:`silber`},{n:75,name:`Meisterwerkstatt`,tier:`gold`}]},...Ye(),{id:`aufgestellt`,category:`handwerk`,box:`ueberlebens`,text:`Stelle {n} eigene Fallen auf.`,value:C(`fallen.aufgestellt`),stages:[{n:5,name:`Hinterhältig`,tier:`bronze`},{n:20,name:`Minenfeld`,tier:`silber`}]},{id:`crawler`,category:`sozial`,box:`fan`,text:`Sprich mit {n} anderen Crawlern.`, tion:`Besiege 25 Gegner barfuß.`,comment:`Deine Fußsohlen sind inzwischen härter als die meisten Rüstungen hier unten.`,check:w(`kills.barfuss`,25)},{id:`mo_bademantel`,name:`Frottee-Terror`,tier:`silber`,box:`kleidung`,description:`Besiege 25 Gegner im Bademantel.`,comment:`Der gefürchtetste Bademantel der Galaxis. Es gibt schon Fanartikel.`,check:w(`kills.bademantel`,25)},{id:`mo_angetrunken`,name:`Kneipenschlägerei`,tier:`bronze`,box:`brawler`,description:`Besiege 5 Gegner, während du angetrunken bist.`,comment:`Dein Kampfstil ist unvorhersehbar. Für alle Beteiligten, dich eingeschlossen.`,check:w(`kills.angetrunken`,5)},{id:`mo_feuertaufe`,name:`Feuertaufe`,tier:`silber`,box:`ueberlebens`,description:`Besiege einen Gegner, während du selbst in Flammen stehst.`,comment:`Du brennst, und trotzdem hast du zuerst an ihn gedacht. Das nennt man Prioritäten.`,check:w(`kills.selbstbrennend`)},{id:`mo_blindflug`,name:`Blindflug`,tier:`silber`,box:`brawler`,description:`Besiege einen Gegner, während du geblendet bist.`,comment:`Du hast nichts gesehen. Der Gegner leider schon.`,check:w(`kills.geblendet`)},{id:`mo_mut`,name:`Mut ist, wenn man trotzdem zuschlägt`,tier:`silber`,box:`fan`,description:`Besiege einen Gegner, während du verängstigt bist.`,comment:`Die Knie haben gezittert. Die Faust nicht.`,check:w(`kills.veraengstigt`)},{id:`mo_boss_makellos`,name:`Makellos`,tier:`gold`,box:`boss`,description:`Besiege einen Boss, während du volle Lebenspunkte hast.`,comment:`Nicht ein Kratzer. Der Boss hat sich beim Management beschwert. Abgelehnt.`,check:w(`boss.makellos`)},{id:`mo_boss_zauber`,name:`Abrakadabra`,tier:`gold`,box:`boss`,description:`Besiege einen Boss mit einem Zauber.`,comment:`Ein Fingerschnippen, ein Boss weniger. Die Magieabteilung ist stolz auf dich.`,check:w(`boss.zauber`)},{id:`mo_boss_falle`,name:`In die Falle gelockt`,tier:`gold`,box:`boss`,description:`Besiege einen Boss mit einer Falle oder einem Sprengsatz.`,comment:`Planung schlägt Muskeln. Und Sprengstoff schlägt beides.`,check:w(`boss.falle`)},{id:`mo_boss_haustier`,name:`Braves Tier!`,tier:`gold`,box:`haustier`,description:`Lass dein Haustier den letzten Treffer gegen einen Boss landen.`,comment:`Du hast die Vorarbeit gemacht. Die Zuschauer jubeln trotzdem nur dem Tier zu.`,check:w(`boss.haustier`)},{id:`mo_boss_party`,name:`Gemeinsam stark`,tier:`silber`,box:`boss`,description:`Lass ein Party-Mitglied den letzten Treffer gegen einen Boss landen.`,comment:`Teamarbeit. Der Ruhm wird geteilt. Die Beute nicht.`,check:w(`boss.party`)},{id:`mo_boss_sprung`,name:`Todessprung`,tier:`gold`,box:`schuh`,description:`Besiege einen Boss mit einem Sprungangriff.`,comment:`Aus der Luft, mit vollem Gewicht. Die Kamera hat es aus sieben Winkeln.`,check:w(`boss.sprung`)},{id:`mo_boss_kopf`,name:`Kopf ab, Krone weg`,tier:`gold`,box:`boss`,description:`Besiege einen Boss mit einem gezielten Kopftreffer.`,comment:`Genau zwischen die Augen. Oder wo auch immer dieses Ding seine Augen hatte.`,check:w(`boss.kopf`)},{id:`mo_boss_gerammt`,name:`Vorfahrt missachtet`,tier:`platin`,box:`boss`,description:`Besiege einen Boss, indem du ihn mit deinem Reittier rammst.`,comment:`Der Unfallbericht ist eindeutig. Der Boss hätte nicht auf der Fahrbahn stehen sollen.`,check:w(`boss.gerammt`)},{id:`mo_boss_konter`,name:`Der Spieß umgedreht`,tier:`gold`,box:`brawler`,description:`Besiege einen Boss mit einem Konter.`,comment:`Er hat angegriffen. Du hast geantwortet. Das Gespräch ist beendet.`,check:w(`boss.konter`)},{id:`mo_boss_schlafend`,name:`Gute-Nacht-Geschichte`,tier:`gold`,box:`boss`,description:`Besiege einen Boss, der noch schläft.`,comment:`Er ist nie aufgewacht. Die Zuschauer finden das unfair. Die Wettquoten fanden es großartig.`,check:w(`boss.schlafend`)},{id:`mo_explosion3`,name:`Drei auf einen Streich`,tier:`gold`,box:`wurf`,description:`Besiege drei Gegner mit einer einzigen Explosion.`,comment:`Effizienz ist das neue Schwarz. Oder das neue Verkohlt.`,check:w(`max.explosionkills`,3)},{id:`mo_eigentor`,name:`Eigentor`,tier:`bronze`,box:`ueberlebens`,description:`Werde von deinem eigenen Sprengsatz getroffen.`,comment:`Die Druckwelle kennt keine Freunde. Das steht auch klein gedruckt auf der Packung.`,check:w(`explosion.selbst`)},{id:`mo_befreit_kampf`,name:`Entfesselungskunst`,tier:`silber`,box:`ueberlebens`,description:`Befreie dich aus einer Falle, während ein Gegner direkt auf dich zukommt.`,comment:`Genau im richtigen Moment. Die Musik der Regie hat perfekt gepasst.`,check:w(`befreit.kampf`)},{id:`mo_weitwurf`,name:`Weitwurf`,tier:`bronze`,box:`wurf`,description:`Besiege einen Gegner mit einem Wurf aus mindestens fünf Feldern Entfernung.`,comment:`Die Flugbahn war perfekt. Das Ziel war es danach nicht mehr.`,check:w(`kills.weitwurf`)},{id:`mo_ein_lp`,name:`Ein einziger Lebenspunkt`,tier:`gold`,box:`ueberlebens`,description:`Überlebe einen Treffer mit genau einem Lebenspunkt.`,comment:`Eins. Ein Punkt. Die Systemstimme hatte den Nachruf schon angefangen.`,check:w(`ueberlebt.einlp`)},{id:`mo_trank_knapp`,name:`Rettung aus der Flasche`,tier:`silber`,box:`ueberlebens`,description:`Trinke einen Trank mit weniger als 10 % deiner Lebenspunkte.`,comment:`Ein Schluck zwischen dir und dem Jenseits. Er hat geschmeckt wie Hustensaft.`,check:w(`traenke.knapp`)},{id:`mo_rettung_haustier`,name:`Gerettet von der Fellnase`,tier:`silber`,box:`haustier`,description:`Dein Haustier besiegt einen Gegner, während du fast tot bist.`,comment:`Das Tier hat dir das Leben gerettet. Es wird dich nie wieder vergessen lassen.`,check:w(`rettung.haustier`)},{id:`mo_rettung_party`,name:`Rückendeckung`,tier:`silber`,box:`abenteurer`,description:`Ein Party-Mitglied besiegt einen Gegner, während du fast tot bist.`,comment:`Freunde sind Leute, die im richtigen Moment zuschlagen. Diesmal wörtlich.`,check:w(`rettung.party`)},{id:`mo_saferoom_knapp`,name:`Rettendes Ufer`,tier:`silber`,box:`ueberlebens`,description:`Betritt einen Safe Room, während ein Gegner direkt hinter dir ist.`,comment:`Der Türsteher hat nur kurz genickt. Dein Verfolger durfte draußen bleiben.`,check:w(`saferoom.knapp`)},{id:`mo_tuer_zu`,name:`Tür zu, es zieht!`,tier:`bronze`,box:`abenteurer`,description:`Schließe eine Tür, während ein wacher Gegner ganz in der Nähe ist.`,comment:`Monster können Türen öffnen. Aber es ist die Geste, die zählt.`,check:w(`tueren.zugeschlagen`)},{id:`mo_schlaflos`,name:`Schlaflos im Keller`,tier:`silber`,box:`ueberlebens`,description:`Halte 24 Stunden durch, ohne zu schlafen.`,comment:`Deine Augenringe haben eigene Augenringe. Die Zuschauer sind trotzdem begeistert.`,check:w(`max.wach`,480)},{id:`mo_umzingelt_aufstieg`,name:`Aufstieg unter Druck`,tier:`silber`,box:`brawler`,description:`Steige eine Stufe auf, während dich mindestens zwei Gegner bedrängen.`,comment:`Du hast gelevelt. Die Monster nicht. Das wird ihnen gleich leidtun.`,check:w(`aufstieg.umzingelt`)},{id:`mo_doppelaufstieg`,name:`Doppelter Aufstieg`,tier:`gold`,box:`abenteurer`,description:`Steige mit einem einzigen Kill zwei Stufen auf einmal auf.`,comment:`So viel Erfahrung auf einmal. Dein Kopf brummt, aber auf die gute Art.`,check:w(`max.aufstiege.zug`,2)},{id:`mo_snack`,name:`Snack zwischendurch`,tier:`bronze`,box:`ueberlebens`,description:`Iss etwas, während ein Gegner direkt neben dir steht.`,comment:`Hunger kennt keinen Waffenstillstand. Der Gegner war ehrlich gesagt beeindruckt.`,check:w(`essen.imkampf`)},{id:`mo_toilette_kampf`,name:`Es war dringend`,tier:`silber`,box:`kleidung`,description:`Benutze eine Toilette, während ein wacher Gegner in der Nähe ist.`,comment:`Manche Dinge können nicht warten. Die Regie hat diskret weggeblendet. Fast.`,check:w(`toilette.imkampf`)},{id:`mo_unfall`,name:`Malheur`,tier:`bronze`,box:`kleidung`,description:`Schaffe es nicht mehr rechtzeitig zur Toilette.`,comment:`Das haben ungefähr vier Milliarden Zuschauer gesehen. Die Wiederholung läuft in Endlosschleife.`,check:w(`unfall`)},{id:`mo_boxen_horten`,name:`Lieber später auspacken`,tier:`bronze`,box:`abenteurer`,description:`Horte 10 ungeöffnete Boxen gleichzeitig.`,comment:`Vorfreude ist die schönste Freude. Oder du hast einfach vergessen, sie zu öffnen.`,check:(e,t)=>t.player.boxes.length>=10},{id:`mo_goldbad`,name:`Goldbad`,tier:`gold`,box:`abenteurer`,description:`Besitze 2.000 Gold auf einmal.`,comment:`Du könntest darin baden. Bitte tu es nicht. Die Zuschauer haben schon genug gesehen.`,check:w(`max.gold`,2e3)},{id:`mo_feilschen_max`,name:`Halsabschneider`,tier:`silber`,box:`abenteurer`,description:`Handle mindestens 25 % Rabatt heraus.`,comment:`Hinter der Theke wird leise geweint. Du hast kein Mitleid.`,check:w(`feilschen.maximal`)},{id:`mo_feilschen_pleiten`,name:`Beratungsresistent`,tier:`bronze`,box:`fan`,description:`Scheitere dreimal hintereinander beim Feilschen.`,comment:`Die Preise sind jetzt höher als vorher. Das nennt man wohl Verhandlungsgeschick.`,check:w(`max.feilschpleiten`,3)},{id:`mo_ausverkauf`,name:`Alles muss raus`,tier:`gold`,box:`abenteurer`,description:`Kaufe einen Laden komplett leer.`,comment:`Das Regal ist leer, die Kasse ist voll. Der Laden macht heute früher zu.`,check:w(`laden.leergekauft`)},{id:`mo_jackpot`,name:`Drei goldene Kronen`,tier:`gold`,box:`fan`,description:`Knacke den Jackpot eines Rubbelloses.`,comment:`Die Chancen standen schlecht. Die Systemstimme prüft gerade, ob du geschummelt hast.`,check:w(`lose.jackpot`)},{id:`mo_nieten`,name:`Dauerpech`,tier:`bronze`,box:`fan`,description:`Ziehe 10 Nieten beim Rubbellos.`,comment:`Zehn Nieten. Das Glücksspiel ist nicht dein Freund. Die Losbude sieht das anders.`,check:w(`lose.nieten`,10)},{id:`mo_kettenzauber`,name:`Kettenreaktion`,tier:`gold`,box:`abenteurer`,description:`Besiege drei Gegner mit einem einzigen Zauber.`,comment:`Ein Zauber, drei Beerdigungen. Die Magieabteilung verlangt eine Gebühr für die Nutzung.`,check:e=>e.type===`spellCast`&&e.kills>=3},{id:`mo_gerettet_party`,name:`Vom Retter zum Freund`,tier:`gold`,box:`abenteurer`,description:`Nimm einen Crawler in die Party auf, den du vorher versorgt hast.`,comment:`Freundschaft beginnt mit einem Heiltrank. So steht es in keinem Buch, aber es stimmt.`,check:w(`party.gerettet`)},{id:`mo_auftrag_verpatzt`,name:`Versprochen ist versprochen`,tier:`bronze`,box:`fan`,description:`Lass einen Auftrag scheitern.`,comment:`Die Enttäuschung im Gesicht deines Auftraggebers war sehenswert. Die Zuschauer haben es genossen.`,check:w(`auftraege.verpatzt`)},{id:`mo_etage2_frueh`,name:`Mut zur Lücke`,tier:`silber`,box:`ueberlebens`,description:`Erreiche Etage 2 mit Stufe 3 oder weniger.`,comment:`Unterlevelt, aber optimistisch. Die Systemstimme hat die Sterbeversicherung schon mal angefragt.`,check:(e,t)=>e.type===`descend`&&e.floor===2&&t.player.level<=3},{id:`mo_etage3_frueh`,name:`Ins kalte Wasser`,tier:`gold`,box:`ueberlebens`,description:`Erreiche Etage 3 mit Stufe 6 oder weniger.`,comment:`Die Kanalisation erwartet dich. Sie hat Hunger, und du bist sehr klein.`,check:(e,t)=>e.type===`descend`&&e.floor===3&&t.player.level<=6}];for(let[e,t,n,r]of[[`bratpfanne`,`Gut durch`,`Besiege 5 Gegner mit einer Bratpfanne.`,`Das Geräusch einer Bratpfanne auf einem Schädel ist Musik. Sagt die Tonabteilung.`],[`handtasche`,`Handtaschen-Hieb`,`Besiege 5 Gegner mit einer schweren Handtasche.`,`Was da wohl drin ist? Niemand wagt es zu fragen.`],[`regenschirm`,`Bei jedem Wetter`,`Besiege 5 Gegner mit einem Regenschirm.`,`Hier unten regnet es nie. Der Schirm hat trotzdem seinen Zweck gefunden.`],[`nudelholz`,`Ausgerollt`,`Besiege 5 Gegner mit einem Nudelholz.`,`Flach wie ein Pizzateig. Die Kochshow des Senders hat angefragt.`],[`golfschlaeger`,`Einlochen`,`Besiege 5 Gegner mit einem Golfschläger.`,`Ein sauberer Abschlag. Das Loch war allerdings ein Monster.`],[`tischtennis`,`Rückhand`,`Besiege 5 Gegner mit einem Tischtennisschläger.`,`Niemand hat das kommen sehen. Wirklich niemand.`],[`kettensaege`,`Auch ohne Benzin`,`Besiege 5 Gegner mit der Kettensäge ohne Benzin.`,`Sie läuft nicht. Sie e`,tier:`gold`,box:`abenteurer`,description:`Töte einen Wolpertinger, einen Tatzelwurm und einen Chupacabra.`,comment:`Die Wissenschaft hätte sie gern lebend gehabt. Die Wissenschaft ist aber tot.`,check:(e,t)=>!!ot(e)&&[`wolpertinger`,`tatzelwurm`,`chupacabra`].every(e=>(t.counters.killsByDef[e]??0)>0)},{id:`erstkontakt`,name:`Erstkontakt`,tier:`silber`,box:`abenteurer`,description:`Töte einen außerirdischen Späher.`,comment:`Die Menschheit hat endlich Aliens getroffen. Und sofort verprügelt. Typisch.`,check:e=>st(e,`grauer_spaeher`)||st(e,`grey_drohne`)},{id:`mimic`,name:`Nicht alles ist, wie es scheint`,tier:`silber`,box:`abenteurer`,description:`Besiege einen Mimic.`,comment:`Ab jetzt wirst du jeden Müllsack misstrauisch ansehen. Zu Recht.`,check:e=>!!ot(e)&&vt.includes(ot(e).defId)},{id:`toaster`,name:`Frühstück ist fertig`,tier:`bronze`,box:`kleidung`,description:`Besiege einen Rauchenden Toaster.`,comment:`Leicht angebrannt. Wie immer.`,check:e=>st(e,`toaster_mimic`)},{id:`friedhof`,name:`Friedhofsruhe`,tier:`silber`,box:`waffen`,description:`Töte 10 Untote.`,comment:`Tot, untot, wieder tot. Der Kreislauf des Lebens, Kellerversion.`,check:(e,t)=>!!ot(e)&&gt.includes(ot(e).defId)&&at(t,gt)===10},{id:`verstaerkung`,name:`Verstärkung abgelehnt`,tier:`silber`,box:`brawler`,description:`Töte einen Gegner, der bereits Verstärkung gerufen hat.`,comment:`Er hat seine Freunde angerufen. Jetzt können sie gemeinsam auf der Beerdigung sein.`,check:e=>(ot(e)?.summoned??0)>0},{id:`dosenoeffner`,name:`Dosenöffner`,tier:`silber`,box:`schuh`,description:`Töte einen gepanzerten Gegner mit einem Tritt.`,comment:`Fäuste prallen ab. Füße nicht. Lektion gelernt.`,check:e=>e.type===`kill`&&!!e.monster.abilities?.includes(`gepanzert`)&&e.technique?.part===`tritt`},{id:`elite5`,name:`Elitejäger`,tier:`gold`,box:`abenteurer`,description:`Besiege 5 Elite-Mobs.`,comment:`Die Elite hat Angst vor dir. Die Elite hat recht.`,check:(e,t)=>ot(e)?.rank===`elite`&&t.counters.eliteKills===5},{id :`Zirkusreif`,tier:`silber`,box:`fan`,description:`Trage Clownsnase und Partyhut gleichzeitig.`,comment:`Wenn schon untergehen, dann mit Stil. Mit sehr fragwürdigem Stil.`,check:(e,t)=>e.type===`equip`&&dt(t,`clownsnase`)&&dt(t,`partyhut`)},{id:`stoeckel`,name:`Hohe Absätze, tiefe Wunden`,tier:`silber`,box:`schuh`,description:`Töte einen Gegner per Tritt, während du Stöckelschuhe trägst.`,comment:`Zwölf Zentimeter Absatz, null Gnade.`,check:(e,t)=>e.type===`kill`&&e.technique?.part===`tritt`&&dt(t,`stoeckelschuhe`)},{id:`legendaer`,name:`Legendär!`,tier:`gold`,box:`abenteurer`,description:`Finde einen legendären Gegenstand.`,comment:`Orange! Es ist orange! Alle Gamer der Galaxis kreischen gerade.`,check:e=>ht(e,[`legendaer`,`himmlisch`])},{id:`himmlisch`,name:`Himmlische Fügung`,tier:`legendaer`,box:`abenteurer`,description:`Finde einen himmlischen Gegenstand.`,comment:`Es gibt davon nur eine Handvoll in der Geschichte der Show. Und du hast eins. Die Systemstimme ist neidisch.`,check:e=>ht(e,[`himmlisch`])},{id:`gold100`,name:`Dagobert-Syndrom`,tier:`silber`,box:`fan`,description:`Besitze 100 Gold auf einmal.`,comment:`Hundert Goldstücke. Du könntest darin baden. Bitte nicht.`,check:(e,t)=>e.type===`goldGained`&&t.player.gold>=100},{id:`gold500`,name:`Kapitalist`,tier:`gold`,box:`fan`,description:`Verdiene insgesamt 500 Gold.`,comment:`Die Wirtschaft ist zusammengebrochen. Deine nicht.`,check:(e,t)=>e.type===`goldGained`&&t.counters.goldEarned>=500},{id:`drei_gaenge`,name:`Drei-Gänge-Menü`,tier:`silber`,box:`ueberlebens`,description:`Iss dreimal in einem Restaurant.`,comment:`Vorspeise, Hauptgang, Monster. Guten Appetit.`,check:(e,t)=>e.type===`eat`&&t.counters.mealsEaten===3},{id:`winterschlaf`,name:`Winterschlaf`,tier:`silber`,box:`ueberlebens`,description:`Schlafe fünfmal in Safe Rooms.`,comment:`Du verschläfst die Apokalypse. Respekt.`,check:(e,t)=>e.type===`sleep`&&t.counters.sleeps===5},{id:`trankjunkie`,name:`Trank-Junkie`,tier:`silber`,box:`ueberlebens`,description:`Trinke 10 Tränke.`,comment:`Kirsche, Kreide, Verzweiflung. Du kennst alle Geschmacksrichtungen.`,check:(e,t)=>e.type!==`moved`&&t.counters.potionsDrunk===10},{id:`boxen25`,name:`Schatzsucher`,tier:`gold`,box:`fan`,description:`Öffne 25 Lootboxen.`,comment:`Du hast ein Problem. Ein glänzendes, belohnendes Problem.`,check:(e,t)=>e.type===`boxOpened`&&t.counters.boxesOpened===25},{id:`haustier5`,name:`Tierischer Aufstieg`,tier:`gold`,box:`haustier`,description:`Bringe dein Haustier auf Stufe 5.`,comment:`Dein Haustier ist jetzt gefährlicher als du. Merk dir das.`,check:(e,t)=>e.type===`kill`&&(t.player.pet?.level??0)>=5},{id:`level10`,name:`Zweistellig`,tier:`gold`,box:`abenteurer`,description:`Erreiche Level 10.`,comment:`Level 10. Jetzt bist du offiziell kein Futter mehr. Nur noch Vorspeise.`,check:e=>e.type===`levelUp`&&e.level===10},{id:`level15`,name:`Veteran`,tier:`platin`,box:`abenteurer`,description:`Erreiche Level 15.`,comment:`Die meisten Crawler sterben lange vorher. Du bist nicht wie die meisten. Leider für die Monster.`,check:e=>e.type===`levelUp`&&e.level===15},{id:`skill10`,name:`Meisterklasse`,tier:`gold`,box:`brawler`,description:`Bringe einen Skill auf Stufe 10.`,comment:`Zehntausend Stunden Übung? Hier reichen ein paar hundert Kämpfe.`,check:e=>e.type===`skillUp`&&e.level===10},{id:`vielseitig`,name:`Vielseitig`,tier:`silber`,box:`abenteurer`,description:`Lerne 5 Skills durch Übung.`,comment:`Du kannst ein bisschen von allem. Die Systemstimme nennt das „unentschlossen“.`,check:(e,t)=>e.type===`skillLearned`&&t.player.skills.filter(e=>![`erste_hilfe`,`kochen`,`spielerfahrung`].includes(e.id)).length===5},{id:`streber`,name:`Streber`,tier:`silber`,box:`abenteurer`,description:`Schließe das Tutorial in der ersten Stunde ab.`,comment:`Direkt zur Gilde. Keine Umwege. Deine Lehrer hätten dich geliebt.`,check:(e,t)=>e.type===`tutorialDone`&&t.turn<=20},{id:`anleitung`,name:`Wer braucht schon Anleitungen?`,tier:`silber`,box:`brawler`,description:`Sc ption:`Töte 50 Mobs.`,comment:`Auf der Erde hätte man dich dafür eingesperrt. Hier gibt es eine Box.`,check:(e,t)=>e.type===`kill`&&t.counters.kills===50},{id:`rattenfaenger`,name:`Rattenfänger von Hameln (ohne Flöte)`,tier:`silber`,box:`abenteurer`,description:`Töte 20 Ratten jeglicher Art.`,comment:`Die Ratten haben einen Namen für dich. Er ist nicht nett.`,check:(e,t)=>e.type===`kill`&&(t.counters.killsByDef.kellerratte??0)+(t.counters.killsByDef.rattenmensch??0)===20},{id:`david`,name:`David gegen Goliath`,tier:`silber`,box:`wurf`,description:`Töte einen Mob, der mindestens 3 Level über dir ist.`,comment:`Statistisch hättest du sterben müssen. Die Statistikabteilung ist verärgert.`,check:(e,t)=>e.type===`kill`&&e.monster.level>=t.player.level+3},{id:`multitasker`,name:`Kampf-Multitasking`,tier:`silber`,box:`brawler`,description:`Töte einen Gegner, nachdem du ihn mit 4 verschiedenen Techniken getroffen hast.`,comment:`Faust, Fuß, Knie, Kopf. Du hast einfach alles an ihm ausprobiert. Wie ein Kleinkind mit einem Gummihammer.`,check:e=>e.type===`kill`&&new Set(e.monster.hitBy??[]).size>=4},{id:`ruepel`,name:`Rüpel`,tier:`bronze`,box:`brawler`,description:`Töte einen fliehenden Gegner.`,comment:`Er wollte doch nur weg. Du Monster. Die Zuschauer sind begeistert.`,check:e=>e.type===`kill`&&!!e.monster.fleeing},{id:`hinterhalt`,name:`Buh!`,tier:`bronze`,box:`brawler`,description:`Töte einen Gegner mit einem einzigen Schlag, bevor er dich bemerkt.`,comment:`Er hat dich nicht kommen sehen. Er wird auch sonst nichts mehr sehen.`,check:e=>e.type===`kill`&&!e.monster.aware&&(e.monster.hitBy?.length??0)<=1},{id:`knapp_daneben`,name:`Knapp daneben ist auch vorbei`,tier:`bronze`,box:`ueberlebens`,description:`Verfehle 5-mal hintereinander.`,comment:`Die Zuschauer haben ein Trinkspiel erfunden. Es heißt „Wann trifft er endlich?“.`,check:(e,t)=>e.type===`attack`&&!e.hit&&t.counters.missStreak===5},{id:`sandsack`,name:`Menschlicher Sandsack`,tier:`bronze`,box:`ueberlebens`,descrip  mit einer improvisierten Waffe.`,comment:`Das war mal ein Möbelstück. Jetzt ist es ein Mordwerkzeug. Nachhaltig!`,check:e=>e.type===`kill`&&e.technique?.part===`waffe`},{id:`anlauf1`,name:`Mit Anlauf!`,tier:`bronze`,box:`brawler`,description:`Töte einen Gegner mit einem Sturmangriff.`,comment:`Zehn Meter Anlauf für einen Schlag. Effizienz sieht anders aus. Unterhaltung nicht.`,check:e=>e.type===`kill`&&e.technique?.move===`anlauf`},{id:`nackter_boss`,name:`Die nackte Wahrheit`,tier:`gold`,box:`kleidung`,description:`Besiege einen Boss ohne angelegte Ausrüstung.`,comment:`Keine Rüstung. Keine Waffe. Kaum Kleidung. Nur Wut. Die Einschaltquoten explodieren.`,check:(e,t)=>e.type===`kill`&&e.monster.rank!==`normal`&&e.monster.rank!==`elite`&&Et(t)===0},{id:`elite1`,name:`Nicht mehr ganz so normal`,tier:`bronze`,box:`abenteurer`,description:`Besiege einen Elite-Mob.`,comment:`Er war etwas größer, etwas stärker und etwas hässlicher. Jetzt ist er vor allem: tot.`,check:e=>e.type===`kill`&&e.monster.rank===`elite`},{id:`hoodboss1`,name:`Nachbarschaftshilfe`,tier:`silber`,box:`boss`,description:`Besiege einen Nachbarschafts-Boss.`,comment:`Das Viertel ist jetzt sicherer. Es ist auch leerer. Beides deine Schuld.`,check:e=>e.type===`kill`&&e.monster.rank===`nachbarschaftsboss`},{id:`hoodboss4`,name:`Bürgermeister der Ruinen`,tier:`gold`,box:`boss`,description:`Besiege alle vier Nachbarschafts-Bosse einer Etage.`,comment:`Vier Viertel, vier Bosse, vier Beerdigungen. Du solltest ein Bestattungsunternehmen gründen.`,check:(e,t)=>e.type===`kill`&&e.monster.rank===`nachbarschaftsboss`&&t.map.hoods.every(e=>!e.bossAlive)},{id:`boroughboss`,name:`Oma ist satt`,tier:`gold`,box:`boss`,description:`Besiege den Borough-Boss.`,comment:`Du hast eine riesige Oma verprügelt. Deine eigene Oma wäre… eigentlich stolz. Sie war ja auch so.`,check:e=>e.type===`kill`&&e.monster.rank===`boroughboss`},{id:`lebensmuede`,name:`Lebensmüde`,tier:`gold`,box:`ueberlebens`,description:`Besiege einen Boss, d
